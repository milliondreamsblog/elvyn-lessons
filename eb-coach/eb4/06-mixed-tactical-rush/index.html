  :root { --amber: #d97706; --amber-deep: #b45309; --amber-soft: #fef3c7; --ink: #1c1917; --muted: #78716c; --line: #e7e5e4;
          --bg: #faf9f7; --surface: #fff; --good: #15803d; --bad: #b91c1c; --navy: #1f2a44;
          --sans: "Geist", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { overflow-x: clip; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.5 var(--sans); letter-spacing: -.01em;
    -webkit-font-smoothing: antialiased; }
  button { touch-action: manipulation; font: inherit; color: var(--ink); cursor: pointer; }
  a { color: inherit; }

  .topbar { max-width: 1120px; margin: 0 auto; padding: 14px 16px 6px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .logo { display: inline-flex; align-items: center; height: 36px; padding: 0 10px; background: #000; border-radius: 10px; color: #fff;
    font: 600 15px/1 var(--sans); text-decoration: none; }
  .logo img { display: block; height: 24px; width: auto; }
  .back { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 7px 14px; font-size: 14px; text-decoration: none;
    transition: transform .18s ease, border-color .18s ease; }
  .back:hover { transform: scale(1.02); border-color: #a8a29e; }
  .ttl { display: flex; flex-direction: column; line-height: 1.2; min-width: 0; flex: 1; }
  .ttl .eyebrow { font: 500 11px/1.3 var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .ttl h1 { margin: 2px 0 0; font: 600 clamp(19px, 2.4vw, 26px)/1.15 var(--sans); letter-spacing: -.025em; }
  .coachtag { display: none; padding: 5px 12px; border-radius: 999px; background: var(--navy); color: #fff; font: 600 12px/1 var(--sans);
    letter-spacing: .12em; text-transform: uppercase; }
  body.mode-coach .coachtag { display: inline-block; }
  body.mode-coach { --bg: #f4f6fa; }

  /* Progress dots (student) / puzzle chips (coach): number + level badge */
  #dots { max-width: 1120px; margin: 4px auto 10px; padding: 0 16px; display: flex; gap: 8px; flex-wrap: wrap; }
  #dots button { position: relative; width: 38px; height: 38px; border-radius: 50%; border: 2px solid var(--line); background: #fff;
    font-weight: 700; font-size: 14px; padding: 0; }
  #dots button .lv { position: absolute; right: -6px; bottom: -6px; min-width: 18px; height: 16px; padding: 0 3px; border-radius: 8px;
    background: #fff; border: 1px solid var(--line); color: var(--muted); font: 600 9.5px/14px var(--sans); }
  #dots button.s1, #dots button.s2 { background: var(--amber-soft); border-color: #fbbf24; }
  #dots button.s3 { background: var(--good); border-color: var(--good); color: #fff; }
  #dots button.on { border-color: var(--amber); box-shadow: 0 0 0 3px var(--amber-soft); }
  body.mode-coach #dots button { border-radius: 10px; width: 44px; }
  body.mode-coach #dots button.on { background: var(--navy); color: #fff; border-color: var(--navy); box-shadow: none; }

  main { max-width: 1120px; margin: 0 auto; padding: 0 12px 24px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  @media (min-width: 920px) { main { flex-direction: row; align-items: flex-start; justify-content: center; gap: 26px; } .panel { width: 400px; } }
  .bcol { display: flex; flex-direction: column; gap: 10px; width: min(94vw, 540px, 64vh); }
  @media (max-width: 919px) { .bcol { width: min(96vw, 540px); } }
  #prompt { font: 600 clamp(17px, 2vw, 20px)/1.3 var(--sans); letter-spacing: -.02em; padding: 10px 14px; background: #fff;
    border: 1px solid var(--line); border-left: 4px solid var(--amber); border-radius: 10px; }
  #prompt .side { display: inline-block; margin-right: 8px; vertical-align: 2px; width: 13px; height: 13px; border-radius: 50%; border: 2px solid var(--ink); }
  #prompt .side.w { background: #fff; } #prompt .side.b { background: var(--ink); }

  /* Board: square grid + absolutely positioned pieces + SVG drawing layer (from the Italian Game trainer). */
  .boardwrap { position: relative; }
  #board { position: relative; width: 100%; aspect-ratio: 1; border-radius: 6px; overflow: hidden; box-shadow: 0 2px 10px rgba(0,0,0,.15);
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; cursor: pointer; }
  #board.flash { box-shadow: 0 0 0 4px rgba(220, 38, 38, .75), 0 2px 10px rgba(0,0,0,.15); }
  #sqs { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); }
  .sq { position: relative; }
  .sq.lt { background: #f0d9b5; } .sq.dk { background: #b58863; }
  .sq::before { content: ""; position: absolute; inset: 0; }
  .sq.lt.last { background: #f3dc6b; } .sq.dk.last { background: #d6b545; }
  .sq.sel::before { background: rgba(21, 128, 61, .45); }
  .sq.over::before { box-shadow: inset 0 0 0 4px rgba(255, 255, 255, .85); }
  .sq.mark::before { background: rgba(217, 119, 6, .55); box-shadow: inset 0 0 0 3px rgba(180, 83, 9, .9); }
  .sq.good::before { background: rgba(21, 128, 61, .55); box-shadow: inset 0 0 0 3px rgba(21, 128, 61, .95); }
  .sq.miss::before { box-shadow: inset 0 0 0 4px var(--navy); outline: 3px dashed #fff; outline-offset: -9px; }
  .sq.bad::before { background: rgba(220, 38, 38, .6); }
  .sq.hint::after { content: ""; position: absolute; inset: 0; box-shadow: inset 0 0 0 4px var(--amber); animation: pulse 1s infinite alternate; }
  @keyframes pulse { from { opacity: .45; } to { opacity: 1; } }
  .sq.dot::after { content: ""; position: absolute; left: 36%; top: 36%; width: 28%; height: 28%; border-radius: 50%; background: rgba(20, 20, 20, .25); }
  .sq.cap::after { content: ""; position: absolute; inset: 0; border-radius: 50%; box-shadow: inset 0 0 0 5px rgba(20, 20, 20, .25); }
  .sq .rk, .sq .fl { position: absolute; font-size: 10px; font-weight: 600; z-index: 1; }
  .sq .rk { top: 2px; left: 3px; } .sq .fl { bottom: 1px; right: 3px; }
  .sq.lt .rk, .sq.lt .fl { color: #b58863; } .sq.dk .rk, .sq.dk .fl { color: #f0d9b5; }
  #pcs { position: absolute; inset: 0; pointer-events: none; }
  .pc { position: absolute; left: 0; top: 0; width: 12.5%; height: 12.5%; background-size: 92%; background-position: center;
    background-repeat: no-repeat; transition: transform .24s ease, opacity .2s ease; will-change: transform; z-index: 2; }
  .pc.drag { transition: none; z-index: 10; filter: drop-shadow(0 4px 6px rgba(0,0,0,.35)); }
  .pc.gone { opacity: 0; }
  #board.noanim .pc { transition: none; }
  /* Promotion picker: four pieces in a column on the target file, over a dimmed board. */
  #promo { position: absolute; inset: 0; z-index: 30; }
  #promo .pbg { position: absolute; inset: 0; background: rgba(28, 25, 23, .45); border-radius: 6px; }
  #promo button { position: absolute; width: 12.5%; height: 12.5%; padding: 0; border: 0; border-radius: 50%;
    background: #fff center / 86% no-repeat; box-shadow: 0 2px 8px rgba(0, 0, 0, .35); transition: transform .12s ease, border-radius .12s ease; }
  #promo button:hover, #promo button:focus-visible { transform: scale(1.06); border-radius: 14%; background-color: var(--amber-soft); outline: none; }
  #draw { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }

  #options { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
  #options button { min-height: 48px; padding: 8px 12px; border-radius: 12px; border: 1.5px solid var(--line); background: #fff; font-weight: 600;
    transition: transform .15s ease, border-color .15s ease; }
  #options button:hover:not(:disabled) { transform: translateY(-1px); border-color: var(--amber); }
  #options button.right { background: #f0fdf4; border-color: var(--good); color: var(--good); }
  #options button.wrong { background: #fef2f2; border-color: #fca5a5; color: var(--bad); opacity: .75; }
  body.mode-coach #options button { cursor: default; }

  .tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 12.5px; color: var(--muted); }
  .tools button { height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: #fff; font-size: 13px; }

  .panel { width: min(96vw, 540px); display: flex; flex-direction: column; gap: 12px; }

  /* Pip the pawn (same character and moods as the Italian Game board map). */
  .pip { display: block; overflow: visible; }
  .pip .bodyg { transform-box: view-box; transform-origin: 60px 146px; animation: bob 2.8s ease-in-out infinite; }
  .pip .eyes { transform-box: fill-box; transform-origin: center; animation: blink 4.6s infinite; }
  .pip .mouth { transform-box: fill-box; transform-origin: center; }
  .pip .m-o, .pip .m-big, .pip .brows, .pip .crown, .pip .arms { display: none; }
  .pip[data-mood="oops"] .m-smile { display: none; } .pip[data-mood="oops"] .m-o, .pip[data-mood="oops"] .brows { display: inline; }
  .pip[data-mood="cheer"] .m-smile { display: none; } .pip[data-mood="cheer"] .m-big, .pip[data-mood="cheer"] .crown, .pip[data-mood="cheer"] .arms { display: inline; }
  .pip[data-mood="happy"] .m-smile { stroke-width: 5; }
  .pip.talking .mouth { animation: talk .22s ease-in-out 6 alternate; }
  .pip.anim[data-mood="cheer"] .bodyg { animation: jump .5s cubic-bezier(.3, 1.6, .5, 1) 2, bob 2.8s ease-in-out 1s infinite; }
  .pip.anim[data-mood="oops"] .bodyg { animation: shake .45s ease-in-out 1, bob 2.8s ease-in-out .45s infinite; }
  .pip.anim[data-mood="happy"] .bodyg { animation: hop .4s ease-out 1, bob 2.8s ease-in-out .4s infinite; }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  @keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
  @keyframes talk { from { transform: scaleY(1); } to { transform: scaleY(.35); } }
  @keyframes jump { 0%, 100% { transform: translateY(0) scale(1); } 40% { transform: translateY(-18px) scale(1.04, .96); } }
  @keyframes hop { 0%, 100% { transform: translateY(0); } 45% { transform: translateY(-8px); } }
  @keyframes shake { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-7deg); } 75% { transform: rotate(7deg); } }
  @media (prefers-reduced-motion: reduce) { .pip * { animation: none !important; } }
  .bubble { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 12px 16px 13px;
    box-shadow: 0 1px 2px rgba(31, 42, 68, .06), 0 18px 34px -20px rgba(31, 42, 68, .5); font: 400 16px/1.45 var(--sans); }
  .bubble::before { content: ""; position: absolute; left: -8px; bottom: 28px; width: 14px; height: 14px; background: var(--surface);
    border-left: 1px solid var(--line); border-bottom: 1px solid var(--line); transform: rotate(45deg); border-radius: 0 0 0 3px; }
  .bubble .who { display: block; width: fit-content; font: 600 10.5px/1 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--amber-deep);
    background: var(--amber-soft); padding: 4px 8px; border-radius: 999px; margin-bottom: 7px; }
  .bubble .mv { display: block; font: 600 18px/1.25 var(--sans); letter-spacing: -.02em; margin-bottom: 3px; font-variant-numeric: tabular-nums; }
  .bubble .stars { color: var(--amber); letter-spacing: 3px; } .bubble .stars .off { color: #e7e5e4; }
  .bubble.pop { animation: pop .32s cubic-bezier(.2, 1.4, .4, 1); }
  @keyframes pop { from { transform: scale(.9); opacity: .3; } }
  .talkrow { display: flex; align-items: flex-end; gap: 10px; }
  .talkrow .pip { flex: none; width: 86px; height: 106px; cursor: pointer; }
  .talkrow .bubble { flex: 1; margin-bottom: 22px; min-height: 96px; }
  @media (max-width: 640px) { .talkrow .pip { width: 66px; height: 82px; } .talkrow .bubble { font-size: 15px; margin-bottom: 14px; min-height: 80px; } }

  #hintbox { padding: 10px 14px; border-radius: 10px; background: var(--amber-soft); border: 1px solid #fde68a; font-size: 15px; }
  #moves { font-variant-numeric: tabular-nums; font-size: 15px; line-height: 1.8; min-height: 28px; padding: 8px 12px; background: #fff;
    border: 1px solid var(--line); border-radius: 10px; color: var(--muted); }
  #moves b { color: var(--ink); } #moves .pre { color: #a8a29e; } #moves .cur { background: var(--amber-soft); color: var(--ink); border-radius: 5px; padding: 0 4px; font-weight: 700; }
  .btns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .btns button { height: 48px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--line); background: #fff; font-weight: 500;
    transition: transform .18s ease, border-color .18s ease; }
  .btns button:hover:not(:disabled) { transform: scale(1.02); border-color: #a8a29e; }
  .btns button.primary { background: #111; border-color: #111; color: #fff; font-weight: 600; }
  .btns button.go { background: var(--good); border-color: var(--good); color: #fff; font-weight: 600; }
  .btns button:disabled { opacity: .4; cursor: default; }
  .keys { margin: 0; font-size: 12.5px; color: var(--muted); line-height: 1.6; }
  .keys kbd { display: inline-block; min-width: 20px; padding: 0 5px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px;
    background: #fff; font: 600 11.5px/18px var(--sans); text-align: center; color: var(--ink); }

  /* Finish card (student) */
  #finish { position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center; padding: 16px;
    background: rgba(28, 25, 23, .5); animation: fadein .25s ease; }
  @keyframes fadein { from { opacity: 0; } }
  .fc { background: #fff; border-radius: 22px; padding: 18px 22px 22px; width: min(94vw, 420px); text-align: center; box-shadow: 0 30px 60px -20px rgba(0,0,0,.45); }
  .fc .pip { width: 120px; height: 148px; margin: 0 auto; }
  .fc .big { font-size: 30px; color: var(--amber); font-weight: 700; letter-spacing: .02em; }
  .fc h3 { margin: 2px 0 4px; font-size: 22px; letter-spacing: -.02em; }
  .fc p { margin: 0 0 16px; color: var(--muted); }
  .fc .row { display: grid; gap: 8px; }
  .fc a, .fc button { display: flex; align-items: center; justify-content: center; height: 48px; border-radius: 999px; border: 1px solid var(--line);
    background: #fff; text-decoration: none; font-weight: 500; }
  .fc .primary { background: #111; border-color: #111; color: #fff; font-weight: 600; }
  footer { text-align: center; font-size: 12px; color: var(--muted); padding: 0 16px 20px; }
</style>

const boardEl = $('board'), sqsEl = $('sqs'), pcsEl = $('pcs'), drawEl = $('draw');
const sqEls = {};

(function pieceCss() {

function parseFen(fen) {
  const map = {};
  fen.split(' ')[0].split('/').forEach((row, i) => {
    let f = 0;
    for (const ch of row) {
      if (/\d/.test(ch)) f += +ch;
      else { map['abcdefgh'[f] + (8 - i)] = ch; f++; }
    }
  });
  return map;
}
function mapToFen(map, rest) {
  const rows = [];
  for (let r = 8; r >= 1; r--) {
    let row = '', e = 0;
    for (let f = 0; f < 8; f++) {
      const p = map['abcdefgh'[f] + r];
      if (p) { if (e) { row += e; e = 0; } row += p; } else e++;
    }
    rows.push(row + (e ? e : ''));
  }
  return rows.join('/') + ' ' + rest;
}
function xy(sq) { const f = sq.charCodeAt(0) - 97, r = +sq[1] - 1; return flipped ? [7 - f, r] : [f, 7 - r]; }

const dist = (a, b) => { const [ax, ay] = xy(a), [bx, by] = xy(b); return Math.hypot(ax - bx, ay - by); };
let coordsOn = true;
function buildSquares(flip, coords) {
  flipped = flip; coordsOn = coords;
  sqsEl.innerHTML = '';
  for (let r = 0; r < 8; r++) for (let f = 0; f < 8; f++) {
    const sq = 'abcdefgh'[flip ? 7 - f : f] + (flip ? r + 1 : 8 - r);
    const d = document.createElement('div');
    d.className = 'sq ' + ((f + r) % 2 ? 'dk' : 'lt');
    if (coords && f === 0) d.insertAdjacentHTML('beforeend', `<span class="rk">${sq[1]}</span>`);
    if (coords && r === 7) d.insertAdjacentHTML('beforeend', `<span class="fl">${sq[0]}</span>`);
    sqEls[sq] = d;
    sqsEl.appendChild(d);
  }
  pieces.forEach((pc) => place(pc.el, pc.sq));
}
function makePiece(p) {

  el.className = `pc p-${p === p.toUpperCase() ? 'w' : 'b'}${p.toLowerCase()}`;

}
function setPosition(fen, animate) {
  const want = parseFen(fen);
  boardEl.classList.toggle('noanim', !animate);
  const bySq = {};
  pieces.forEach((pc) => { bySq[pc.sq] = pc; });
  const next = [], used = new Set(), missing = [];
  for (const sq in want) {
    const pc = bySq[sq];
    if (pc && pc.p === want[sq]) { next.push(pc); used.add(pc); place(pc.el, sq); pc.el.classList.remove('drag'); } else missing.push(sq);
  }
  const spare = pieces.filter((pc) => !used.has(pc));
  for (const sq of missing) {
    let best = null;
    for (const pc of spare) if (!used.has(pc) && pc.p === want[sq] && (!best || dist(pc.sq, sq) < dist(best.sq, sq))) best = pc;
    if (best) { used.add(best); best.sq = sq; best.el.classList.remove('drag'); place(best.el, sq); next.push(best); }
    else { const el = makePiece(want[sq]); place(el, sq); next.push({ el, sq, p: want[sq] }); }
  }
  spare.filter((pc) => !used.has(pc)).forEach((pc) => {
    pc.el.classList.add('gone');

}

function arrowSvg(a) {

  const [x1, y1] = center(from), [x2, y2] = center(to);
  const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy) || 1;
  const ex = x2 - dx / len * .55, ey = y2 - dy / len * .55;

  for (const a of specArrows) if (a && a.length >= 2) h += arrowSvg(a);

  for (const c of drawn.circles) { const [x, y] = center(c[0]); h += `<circle cx="${x}" cy="${y}" r=".44" fill="none" stroke="${COLORS[c[1]]}" stroke-width=".07" opacity=".85"/>`; }

}
function clearDrawn() { drawn.arrows = []; drawn.circles = []; renderDraw(); }
function toggleArrow(from, to, col) {
  const i = drawn.arrows.findIndex((a) => a[0] === from && a[1] === to);
  if (i >= 0) { const same = drawn.arrows[i][2] === col; drawn.arrows.splice(i, 1); if (same) { renderDraw(); return; } }

  $('fTitle').textContent = got === max ? 'Perfect! All the stars!' : 'Topic complete!';
  $('fText').textContent = got === max ? 'You solved every puzzle on the first try.' :
    'Want more stars? Play again, or move on to the next topic.';
  if (T.next) { $('fNext').href = T.next.href; $('fNext').textContent = `Next: ${T.next.title} →`; $('fNext').hidden = false; }
  else $('fNext').hidden = true;
  $('finish').hidden = false;
  mood($('pip2'), 'cheer');
}

// ------------------------------------------------------------------ page chrome
$('back').textContent = `← ${T.label}`;
$('eyebrow').textContent = `${T.label} · Topic ${T.n} · ${T.kind}${COACH ? ' · Coach' : ''}`;
$('h1').textContent = T.title;
$('sbtns').hidden = COACH; $('cbtns').hidden = !COACH; $('ckeys').hidden = !COACH;
$('flip').hidden = !COACH;
$('foot').textContent = COACH ? `Coach checkpoint: ${T.goal}` : 'Tap a piece, then tap a square. Or drag the piece.';
load(0);
</script>
</body>
</html>
