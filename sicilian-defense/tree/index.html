  :root { --amber: #d97706; --amber-soft: #fef3c7; --amber-line: #f5c27a; --ink: #1c1917; --muted: #78716c; --line: #e7e5e4;
          --bg: #faf9f7; --card: #fff; --good: #15803d; --bad: #b91c1c;
          --sans: "Geist", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
          --f-bc4: #2563eb; --f-early: #d97706; --f-closed: #7c3aed; --f-alapin: #dc2626; --f-open: #059669; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 400 15px/1.5 var(--sans); letter-spacing: -.01em;
    -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; }
  button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }

  /* Top bar: logo, title, actions. */
  .topbar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; padding: 12px 18px 6px; }
  .logo { justify-self: start; display: inline-flex; align-items: center; height: 36px; padding: 0 10px; background: #000; border-radius: 10px; }
  .logo img { display: block; height: 24px; width: auto; }
  .title { text-align: center; }
  .title h1 { margin: 0; font: 400 clamp(22px, 2.4vw, 30px)/1.1 var(--sans); letter-spacing: -.03em; }
  .title p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
  .actions { justify-self: end; display: flex; gap: 8px; }
  .pill { height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--card);
    font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; gap: 7px; }
  .pill:hover { border-color: #d6d3d1; }
  .pill[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
  .pill svg { width: 15px; height: 15px; }
  @media (max-width: 760px) {
    .topbar { grid-template-columns: 1fr; justify-items: center; }
    .logo, .actions { justify-self: center; }
  }

  /* Two panes: the tree map and the board panel. */
  .app { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 14px; padding: 6px 14px 14px; }
  @media (max-width: 1000px) { .app { grid-template-columns: 1fr; } .map { height: 62vh; } }
  .map { position: relative; min-height: 0; display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  .tools { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  .chip { height: 30px; padding: 0 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); font-size: 13px; font-weight: 500;
    display: inline-flex; align-items: center; gap: 6px; }
  .chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--ink)); }
  .chip[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
  .tools .sp { flex: 1; }
  .zoom { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
  .zoom button { height: 30px; min-width: 34px; padding: 0 9px; border: 0; background: var(--bg); font-size: 13px; font-weight: 500; }
  .zoom button + button { border-left: 1px solid var(--line); }
  .zoom button:hover, .chip:hover { background: #f5f5f4; }
  .chip[aria-pressed="true"]:hover { background: var(--ink); }

  .scroller { flex: 1; min-height: 0; overflow: auto; cursor: grab; background:
    radial-gradient(circle, #e7e5e4 1px, transparent 1.2px) 0 0 / 22px 22px; }
  .scroller.drag { cursor: grabbing; user-select: none; }
  .sizer { position: relative; }
  .canvas { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .links { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
  .links path { fill: none; stroke: #d6d3d1; stroke-width: 1.6; }
  .links path.on { stroke: var(--amber); stroke-width: 2.6; }

  /* A node: branch name, the moves, and (at the end of a line) the engine eval. */
  .node { position: absolute; width: 196px; background: var(--card); border: 1px solid var(--line); border-left: 3px solid var(--c, #a8a29e);
    border-radius: 10px; padding: 7px 9px 7px 9px; cursor: pointer; box-shadow: 0 1px 2px rgba(28, 25, 23, .05);
    transition: box-shadow .15s, border-color .15s; }
  .node:hover { box-shadow: 0 4px 14px -6px rgba(28, 25, 23, .25); }
  .node:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
  .node.path { border-color: var(--amber-line); border-left-color: var(--c, var(--amber)); background: #fffdf8; }
  .node.sel { border-color: var(--amber); box-shadow: 0 0 0 3px var(--amber-soft), 0 6px 18px -8px rgba(217, 119, 6, .5); }
  .node.root { background: var(--ink); color: #fff; border-color: var(--ink); }
  .node.root .mv, .node.root .m { color: #fff; }
  .node.root .nm { color: #fbbf24; }
  .nm { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; letter-spacing: 0; color: var(--c, var(--muted)); margin-bottom: 2px; }
  .nm .tg { margin-left: auto; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; padding: 1px 6px; border-radius: 999px;
    background: #f5f5f4; color: var(--muted); }
  .nm .tg.game { background: var(--amber-soft); color: #92400e; }
  .mv { font-size: 13px; line-height: 1.5; color: var(--ink); font-variant-numeric: tabular-nums; }
  .m { white-space: nowrap; border-radius: 4px; padding: 0 1px; }
  .m:hover { background: var(--amber-soft); }
  .m.cur { background: var(--amber); color: #fff; }
  .m .g { font-weight: 700; }
  .g.good { color: var(--good); } .g.bad { color: var(--bad); }
  .m.cur .g { color: #fff; }
  .more { color: var(--muted); font-size: 12px; }
  .foot { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; margin-top: 4px; }
  .foot .jump { white-space: nowrap; }
  .ev { font-size: 11.5px; font-weight: 600; padding: 1px 7px; border-radius: 999px; background: #f5f5f4; color: #57534e; font-variant-numeric: tabular-nums; }
  .ev.w { background: #dcfce7; color: #166534; } .ev.b { background: #fee2e2; color: #991b1b; } .ev.mate { background: var(--ink); color: #fff; }
  .jump { font-size: 12px; font-weight: 500; color: #b45309; border: 0; background: none; padding: 0; text-decoration: underline; text-underline-offset: 2px; }
  .tog { position: absolute; right: -11px; top: 50%; translate: 0 -50%; min-width: 22px; height: 22px; padding: 0 5px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--card); font-size: 11px; font-weight: 600; color: var(--muted); line-height: 20px; z-index: 2; }
  .tog:hover { border-color: var(--amber); color: var(--amber); }
  .node.root .tog { color: var(--muted); }

  /* Test mode: moves you haven't reached are blurred. */
  .test .node:not(.seen):not(.root) .mv { filter: blur(5px); user-select: none; }

  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; padding: 8px 12px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
  .legend b { color: var(--ink); }

  /* Board panel. */
  .panel { min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 10px; background: var(--card); border: 1px solid var(--line);
    border-radius: 16px; padding: 14px; }
  .crumb { font-size: 12.5px; color: var(--muted); line-height: 1.4; }
  .crumb b { color: var(--ink); font-weight: 600; }
  #board { display: block; width: 100%; max-width: 372px; aspect-ratio: 1; margin: 0 auto; border-radius: 6px; box-shadow: 0 10px 24px -14px rgba(0, 0, 0, .55); }
  .ctrls { display: flex; justify-content: center; gap: 6px; }
  .ctrls button { height: 38px; min-width: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); font-size: 14px; font-weight: 500;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
  .ctrls button:hover { background: #f5f5f4; }
  .ctrls button:disabled { opacity: .4; cursor: default; }
  .ctrls svg { width: 16px; height: 16px; }
  #why { background: var(--bg); border: 1px solid var(--line); border-left: 3px solid var(--amber); border-radius: 8px; padding: 9px 11px; min-height: 64px; font-size: 14px; }
  #why .mvn { font-weight: 700; margin-right: 4px; }
  #why .ask { color: #92400e; font-weight: 500; }
  .choices { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12.5px; color: var(--muted); }
  .choices button { height: 30px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--amber-line); background: #fffaf0; font-size: 13px; font-weight: 600; color: var(--ink); }
  .choices button .nn { font-weight: 400; color: var(--muted); margin-left: 4px; }
  .choices button.on { background: var(--amber); border-color: var(--amber); color: #fff; }
  .choices button.on .nn { color: #fff; }
  .evline { font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .note { font-size: 13px; background: var(--amber-soft); color: #78350f; border-radius: 8px; padding: 8px 10px; }
  .moves { position: relative; flex: 1 0 140px; min-height: 140px; overflow: auto; font-size: 13.5px; line-height: 1.75;
    border-top: 1px solid var(--line); padding-top: 8px; }
  @media (max-width: 1000px) { .moves { flex: none; max-height: 260px; } }
  #board { max-width: min(372px, calc(100vh - 500px)); min-width: 260px; }
  .moves .mh { display: block; margin: 6px 0 0; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
  .moves .mh:first-child { margin-top: 0; }
  .moves .m { cursor: pointer; }
  .moves .m.later { color: #a8a29e; }
  .moves .m.mask { color: transparent; background: repeating-linear-gradient(90deg, #e7e5e4 0 6px, transparent 6px 8px) 0 55% / 100% 3px no-repeat; }
  .moves .m.mask .g { color: transparent; }
  .kbd { font-size: 12px; color: var(--muted); text-align: center; }
  kbd { font: 600 11px/1 var(--sans); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 2px 5px; background: var(--bg); }

  /* Print: every line as an outline with its notes. */
  #print { display: none; }
  @media print {
    @page { margin: 12mm; }
    body { display: block; background: #fff; font-size: 9.5pt; }
    .topbar .actions, .app { display: none !important; }
    .topbar { display: flex; justify-content: space-between; padding: 0 0 6pt; }
    .logo { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    #print { display: block; }
    #print ul { list-style: none; margin: 0; padding-left: 13pt; border-left: 1px solid #d6d3d1; }
    #print > ul { padding-left: 0; border-left: 0; }
    #print li { margin: 3pt 0 0; break-inside: avoid-page; }
    #print .pl { padding-left: 4pt; }
    #print .pn { font-weight: 700; }
    #print .pn small { font-weight: 400; color: #78716c; }
    #print .pm { font-variant-numeric: tabular-nums; }
    #print .pw { color: #57534e; font-size: 8.5pt; }
    #print .ph { font-weight: 700; font-size: 8.5pt; text-transform: uppercase; letter-spacing: .05em; color: #78716c; margin-top: 2pt; }
  }
</style>

  const shift = (id, d) => { pos[id].y += d; visibleKids(id).forEach((k) => shift(k, d)); };
  const place = (id, depth, y0) => {

    for (const k of kids) y += place(k, depth + 1, y) + GY;
    const total = y - GY - y0;

  place(0, 0, PAD);

  els.forEach((el, id) => {
    const p = pos[id];

    el.style.left = p.x + 'px'; el.style.top = p.y + 'px';

    }

function drawLinks() {

    const len = Math.hypot(x2 - x1, y2 - y1), dx = (x2 - x1) / len, dy = (y2 - y1) / len, nx = -dy, ny = dx;
    const hl = .42, w = .15, hw = .44, ex = x2 - dx * .12, ey = y2 - dy * .12, bx = ex - dx * hl, by = ey - dy * hl, sx = x1 + dx * .18, sy = y1 + dy * .18;
    const pts = [[sx + nx * w / 2, sy + ny * w / 2], [bx + nx * w / 2, by + ny * w / 2], [bx + nx * hw / 2, by + ny * hw / 2], [ex, ey],
      [bx - nx * hw / 2, by - ny * hw / 2], [bx - nx * w / 2, by - ny * w / 2], [sx - nx * w / 2, sy - ny * w / 2]];
    s += `<polygon points="${pts.map((p) => p.map((v) => v.toFixed(3)).join(',')).join(' ')}" fill="${a.on ? '#d97706' : '#57534e'}" opacity="${a.on ? .85 : .5}"/>`;
  }
  for (let i = 0; i < 8; i++) {
    const file = o.flip ? FILES[7 - i] : FILES[i], rank = o.flip ? i + 1 : 8 - i;
    s += `<text x="${i + .94}" y="7.93" font-size=".2" text-anchor="end" font-family="system-ui,sans-serif" font-weight="600" fill="${(i + 7) % 2 === 0 ? '#b58863' : '#f0d9b5'}">${file}</text>`;
    s += `<text x=".05" y="${i + .22}" font-size=".2" font-family="system-ui,sans-serif" font-weight="600" fill="${i % 2 === 0 ? '#b58863' : '#f0d9b5'}">${rank}</text>`;
  }
  return '<defs><radialGradient id="chk"><stop offset="0" stop-color="#ef4444" stop-opacity=".95"/><stop offset=".55" stop-color="#ef4444" stop-opacity=".5"/><stop offset="1" stop-color="#ef4444" stop-opacity="0"/></radialGradient></defs>' + s;
}

// ------------------------------------------------------------------ selection + cursor
// sel = the chosen node; cur = how many moves of the path root→sel are played on the board.
function select(id, { at = 'end', keep = false } = {}) {
  const nd = NODES[id];
  if (nd.jump != null && at === 'jump') { id = nd.jump; at = 'start'; }
  sel = id;
  const P = plies(id);
  if (!keep) cur = at === 'start' ? startOf(id) : at === 'first' ? Math.min(P.length, startOf(id) + 1) : typeof at === 'number' ? at : P.length;
  if (test && at === 'end' && !keep) cur = startOf(id);
  // Open collapsed ancestors so the node is visible.
  let opened = false;
  for (const a of pathTo(id).slice(0, -1)) if (collapsed.delete(a)) opened = true;
  if (opened) layout();
  render();
  revealNode(id);
}

function nodeAtCursor(P) {
  // The node whose move is on the board right now (or sel when at its start).
  return cur > 0 ? P[cur - 1].n : 0;
}

function render() {
  const P = plies(sel);
  cur = Math.max(0, Math.min(cur, P.length));
  const done = P[cur - 1];
  const fen = done ? done.m.f : START;
  // Branch point: the move just played ends a node that has choices after it.
  let branch = null;
  if (done && done.i === NODES[done.n].moves.length - 1 && NODES[done.n].kids.length) branch = done.n;
  if (!done && NODES[0].moves.length === 0) branch = 0;
  const nextOnPath = P[cur];
  const arrows = branch != null && !test ? NODES[branch].kids.map((k) => ({ u: NODES[k].moves[0].u, on: nextOnPath && nextOnPath.n === k })) : [];
  const flip = (sideOf(sel) === 'b') !== flipped;
  $('board').innerHTML = boardSVG(fen, { flip, last: done && done.m.u, check: done && /[+#]$/.test(done.m.s), arrows });

  // Seen (for test mode): every node whose last move has been on the board.
  for (const x of P.slice(0, cur)) if (x.i === NODES[x.n].moves.length - 1) seen.add(x.n);

  // Tree highlight.
  const path = new Set(pathTo(sel));
  els.forEach((el, id) => {
    el.classList.toggle('path', path.has(id));
    el.classList.toggle('sel', id === sel);
    el.classList.toggle('seen', seen.has(id));
  });
  document.querySelectorAll('.node .m.cur').forEach((m) => m.classList.remove('cur'));
  if (done) els[done.n].querySelector(`.m[data-i="${done.i}"]`)?.classList.add('cur');
  drawLinks();

  // Crumb: names along the path.
  const names = pathTo(sel).map((n) => NODES[n].name).filter(Boolean);
  $('crumb').innerHTML = names.map((n, i) => (i === names.length - 1 ? `<b>${esc(n)}</b>` : esc(n))).join(' › ');

  // Why box.
  const next = P[cur];
  let why = '';
  if (done) why = `<span class="mvn">${esc(done.m.n)}${esc(done.m.s)}${esc(done.m.g)}</span>${esc(done.m.w || '')}`;
  else why = `<span class="mvn">Start.</span>Press → to play 1.e4.`;
  if (test && next) why += `<div class="ask">${next.m.n.endsWith('.') ? 'White' : 'Black'} to move. What's the move? Press → to check.</div>`;
  else if (!next && !NODES[sel].kids.length) why += `<div class="ask">End of this line.</div>`;
  $('why').innerHTML = why;

  // Choices at a branch point.
  if (branch != null) {
    const kids = NODES[branch].kids;
    $('choices').innerHTML = `<span>${kids.length} choices:</span>` + kids.map((k, j) => {
      const m = NODES[k].moves[0];
      const label = test && !seen.has(k) ? `Choice ${j + 1}` : `${m.n}${m.s}${m.g}`;
      return `<button data-choice="${k}" class="${nextOnPath && nextOnPath.n === k ? 'on' : ''}">${esc(label)}${NODES[k].name ? `<span class="nn">${esc(NODES[k].name)}</span>` : ''}</button>`;
    }).join('');
  } else $('choices').innerHTML = '';

  // Eval of where the selected line ends.
  const e = evText(NODES[sel].ev);
  $('evline').innerHTML = e ? `End of this line: <span class="ev ${e.c}">${esc(e.t)}</span> ${e.t === e.say ? '' : esc(e.say)} <span style="opacity:.7">· Stockfish 19</span>` : '';
  const note = NODES[sel].note || (NODES[sel].kids.length === 0 ? null : null);
  $('note').hidden = !note;
  $('note').textContent = note || '';

  // Move list for the whole path.
  let html = '', k = 0;
  for (const n of pathTo(sel)) {
    const nd = NODES[n];
    if (nd.name) html += `<span class="mh">${esc(nd.name)}</span>`;
    nd.moves.forEach((m, i) => {
      if (m.h) html += `<span class="mh">${esc(m.h)}</span>`;
      const cls = k === cur - 1 ? 'cur' : k >= cur ? (test ? 'mask' : 'later') : '';
      const first = i === 0 || !!m.h;
      html += moveHTML(m, k, first, `data-k="${k}"`).replace('class="m"', `class="m ${cls}"`) + ' ';
      k++;
    });
  }
  const list = $('moves');
  list.innerHTML = html;
  // Keep the current move in view by scrolling the list only (never the panel, so the board stays put).
  const on = list.querySelector('.m.cur');
  if (on && list.scrollHeight > list.clientHeight) {
    const top = on.offsetTop;
    if (top < list.scrollTop + 8 || top > list.scrollTop + list.clientHeight - 28) list.scrollTop = top - list.clientHeight / 2;
  }

  $('first').disabled = $('prev').disabled = cur === 0;
  $('next').disabled = $('last').disabled = cur === P.length && !NODES[sel].kids.length;
}

function step(d) {
  stop();
  const P = plies(sel);
  if (d > 0 && cur === P.length) {
    const kids = NODES[sel].kids;
    if (kids.length) { sel = kids[0]; cur++; render(); revealNode(sel); }
    return;
  }
  cur = Math.max(0, Math.min(P.length, cur + d));
  render();
}

function sibling(d) {
  stop();
  const P = plies(sel);
  // The node whose move comes next (or the one just finished, at the end of the line).
  const n = P[cur] ? P[cur].n : sel;
  const par = NODES[n].parent;
  if (par == null) return;
  const sibs = NODES[par].kids, j = sibs.indexOf(n), t = sibs[(j + d + sibs.length) % sibs.length];
  select(t, { at: startOf(t) + (P[cur] && P[cur].i === 0 ? 0 : 1) });
}

function play() {
  if (timer) return stop();
  const P = plies(sel);
  if (cur >= P.length) cur = startOf(sel);
  $('play-txt').textContent = 'Pause';
  $('play-ico').innerHTML = '<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>';
  const tick = () => {
    if (cur >= plies(sel).length) return stop();
    cur++; render();
    timer = setTimeout(tick, 1000);
  };
  timer = setTimeout(tick, 250);
}
function stop() {
  if (!timer) return;
  clearTimeout(timer); timer = null;
  $('play-txt').textContent = 'Play';
  $('play-ico').innerHTML = '<path d="M8 5v14l11-7z"/>';
}

// ------------------------------------------------------------------ events
canvas.addEventListener('click', (e) => {
  const tog = e.target.closest('[data-tog]');
  if (tog) { const id = +tog.dataset.tog; collapsed.has(id) ? collapsed.delete(id) : collapsed.add(id); layout(); return; }
  const j = e.target.closest('[data-jump]');
  if (j) { stop(); select(+j.dataset.jump, { at: 'start' }); return; }
  const m = e.target.closest('.m[data-n]');
  if (m && !test) { stop(); const id = +m.dataset.n; select(id, { at: startOf(id) + +m.dataset.i + 1 }); return; }
  const el = e.target.closest('.node');
  if (el) { stop(); select(+el.dataset.id, { at: 'end' }); }
});
canvas.addEventListener('keydown', (e) => {
  const el = e.target.closest('.node');
  if (el && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); stop(); select(+el.dataset.id, { at: 'end' }); }
});
$('moves').addEventListener('click', (e) => { const m = e.target.closest('.m[data-k]'); if (m) { stop(); cur = +m.dataset.k + 1; render(); } });
$('choices').addEventListener('click', (e) => { const b = e.target.closest('[data-choice]'); if (b) { stop(); const id = +b.dataset.choice; select(id, { at: 'first' }); } });
$('first').onclick = () => { stop(); cur = 0; render(); };
$('prev').onclick = () => step(-1);
$('next').onclick = () => step(1);
$('last').onclick = () => { stop(); cur = plies(sel).length; render(); };
$('play').onclick = play;
$('flip').onclick = () => { flipped = !flipped; render(); };
$('test').onclick = () => {
  test = !test;
  $('test').setAttribute('aria-pressed', String(test));
  document.body.classList.toggle('test', test);
  seen.clear();
  stop();
  cur = startOf(sel);
  render();
};
$('print-btn').onclick = () => window.print();
$('zin').onclick = () => { zoom = Math.min(1.4, +(zoom + .1).toFixed(2)); applyZoom(); };
$('zout').onclick = () => { zoom = Math.max(.35, +(zoom - .1).toFixed(2)); applyZoom(); };
$('zfit').onclick = () => { zoom = Math.max(.35, Math.min(1, (scroller.clientWidth - 8) / CW, (scroller.clientHeight - 8) / CH * 1.6)); applyZoom(); };
$('expand').onclick = () => { collapsed.clear(); layout(); document.querySelectorAll('[data-fam]').forEach((b) => b.setAttribute('aria-pressed', String(!b.dataset.fam))); };
document.addEventListener('keydown', (e) => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  const k = { ArrowRight: () => step(1), ArrowLeft: () => step(-1), ArrowDown: () => sibling(1), ArrowUp: () => sibling(-1),
    Home: () => { stop(); cur = 0; render(); }, End: () => { stop(); cur = plies(sel).length; render(); } }[e.key];
  if (k) { e.preventDefault(); k(); }
});

// Drag the map to pan.
let drag = null;
scroller.addEventListener('pointerdown', (e) => {
  if (e.target.closest('.node') || e.button !== 0) return;
  drag = { x: e.clientX, y: e.clientY, l: scroller.scrollLeft, t: scroller.scrollTop };
  scroller.setPointerCapture(e.pointerId);
  scroller.classList.add('drag');
});
scroller.addEventListener('pointermove', (e) => { if (drag) { scroller.scrollLeft = drag.l - (e.clientX - drag.x); scroller.scrollTop = drag.t - (e.clientY - drag.y); } });
const endDrag = () => { drag = null; scroller.classList.remove('drag'); };
scroller.addEventListener('pointerup', endDrag);
scroller.addEventListener('pointercancel', endDrag);

// ------------------------------------------------------------------ family chips, subtitle, print outline
$('tools').insertAdjacentHTML('afterbegin', FAMS.map((f) =>
  `<button class="chip" data-fam="${f.fam || ''}" aria-pressed="${f.fam ? 'false' : 'true'}" style="${f.fam ? `--c:${famColor(f.fam)}` : ''}">${f.fam ? '<i></i>' : ''}${esc(f.label)}</button>`).join(''));
document.querySelectorAll('[data-fam]').forEach((b) => (b.onclick = () => { stop(); focusFam(b.dataset.fam || null); if (!b.dataset.fam) { select(0, { at: 'end' }); revealNode(0, false); } }));

const lines = NODES.filter((n) => !n.kids.length).length, moves = NODES.reduce((s, n) => s + n.moves.length, 0);
$('sub').textContent = `${lines} lines · ${moves} moves · from the video, the coach guide and the practice levels`;

$('print').innerHTML = (function outline(id) {
  const nd = NODES[id];
  const e = !nd.kids.length && evText(nd.ev);
  let ms = '', heads = '';
  nd.moves.forEach((m, i) => { ms += (m.h ? `<div class="ph">${esc(m.h)}</div>` : '') + `${m.n.endsWith('.') || i === 0 || m.h ? esc(m.n) : ''}${esc(m.s)}${esc(m.g)} `; });
  const notes = nd.moves.filter((m) => m.w).map((m) => `<b>${esc(m.n)}${esc(m.s)}${esc(m.g)}</b> ${esc(m.w)}`).join(' · ');
  const tag = nd.tag === 'engine' ? ' <small>(engine)</small>' : nd.tag === 'game' ? ' <small>(model game)</small>' : '';
  const ev = e ? ` <small>[${esc(e.t)}${e.t === e.say ? '' : ' · ' + esc(e.say)}]</small>` : '';
  const jump = nd.jump != null ? ` <small>→ same as ${esc(NODES[nd.jump].name)}</small>` : '';
  return `<li><div class="pl">${nd.name ? `<div class="pn">${esc(nd.name)}${tag}</div>` : ''}<div class="pm">${ms}${ev}${jump}</div>${notes ? `<div class="pw">${notes}</div>` : ''}</div>`
    + (nd.kids.length ? `<ul>${nd.kids.map(outline).join('')}</ul>` : '') + '</li>';
})(0).replace(/^/, '<ul>') + '</ul>';

// ------------------------------------------------------------------ go
function boot() {
  layout();
  select(0, { at: 'end' });
  revealNode(0, false);
}
boot();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { layout(); revealNode(sel, false); });
</script>
</body>
</html>
