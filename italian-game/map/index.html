  /* Design: warm paper, deep navy for structure, one muted signature colour per map, amber for highlights.
     Board in dusty blue and ivory, last move in warm amber. */
  :root { --paper: #f6f2ea; --surface: #fff; --navy: #1f2a44; --muted: #6b7183; --line: #e3ddd2; --line-2: #d6cfc2;
          --amber: #e3962b; --amber-deep: #b8720f; --amber-soft: #fcefd6;
          --good: #2e8b62; --bad: #d2483f;
          --lt: #e9eef4; --dk: #8fa6c2; --hl-lt: #f5d98a; --hl-dk: #e0b65a; --hl2-lt: #f6e9c4; --hl2-dk: #ccb88a;
          --sans: "Geist", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--paper); color: var(--navy); font: 400 16px/1.5 var(--sans); letter-spacing: -.01em;
    -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; overflow: hidden; }
  button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }

  .topbar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; padding: 16px 22px 4px; }
  .logo { justify-self: start; display: inline-flex; align-items: center; height: 40px; padding: 0 10px; background: #000; border-radius: 10px; }
  .logo img { display: block; height: 28px; width: auto; }
  .topbar h1 { grid-column: 2; margin: 0; text-align: center; font: 600 clamp(24px, 3vw, 32px)/1.08 var(--sans); letter-spacing: -.035em; }
  .topbar h1 span { font-weight: 400; color: var(--muted); }
  @media (max-width: 640px) { .topbar { grid-template-columns: 1fr; justify-items: center; } .topbar h1 { grid-column: auto; font-size: 24px; } }

  /* Map tabs + zoom */
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 12px 22px 12px; }
  .tab { height: 42px; padding: 0 18px 0 14px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--surface); font-size: 15px; font-weight: 500;
    display: inline-flex; align-items: center; gap: 9px; box-shadow: 0 1px 2px rgba(31, 42, 68, .05);
    transition: transform .18s ease, border-color .18s ease, background-color .18s ease; }
  .tab i { width: 10px; height: 10px; border-radius: 50%; background: var(--tone); box-shadow: 0 0 0 3px color-mix(in srgb, var(--tone) 18%, transparent); }
  .tab:hover { transform: translateY(-1px); border-color: var(--tone); }
  .tab[aria-pressed="true"] { background: var(--tone); border-color: var(--tone); color: #fff; box-shadow: 0 8px 18px -10px var(--tone); }
  .tab[aria-pressed="true"] i { background: #fff; box-shadow: 0 0 0 3px rgba(255, 255, 255, .25); }
  .bar .sp { flex: 1; }
  .zoom { display: inline-flex; align-items: center; gap: 6px; }
  .zoom button { height: 42px; min-width: 42px; padding: 0 15px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--surface); font-size: 15px; font-weight: 500;
    box-shadow: 0 1px 2px rgba(31, 42, 68, .05); transition: transform .18s ease, border-color .18s ease; }
  .zoom button.round { width: 42px; padding: 0; font-size: 21px; line-height: 1; }
  .zoom button:hover { transform: translateY(-1px); border-color: var(--navy); }

  /* The map */
  .scroller { position: relative; flex: 1; min-height: 0; overflow: auto; cursor: grab; margin: 0 16px 16px; border: 1px solid var(--line); border-radius: 24px;
    background: radial-gradient(circle, #e8e1d5 1.2px, transparent 1.5px) 0 0 / 26px 26px, #fffdf9;
    box-shadow: inset 0 1px 0 #fff, 0 1px 2px rgba(31, 42, 68, .04); }
  .scroller.drag { cursor: grabbing; user-select: none; }
  .sizer { position: relative; }
  .canvas { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .links { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
  .links path { fill: none; stroke: #d9d1c3; stroke-width: 2.5; stroke-linecap: round; }
  .links path.on { stroke: var(--amber); stroke-width: 4; }

  /* A board card: the moves on top, the board below, a thin bar in the map's colour on top. */
  .card { position: absolute; width: 212px; padding: 11px 9px 9px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
    box-shadow: 0 1px 2px rgba(31, 42, 68, .06), 0 14px 26px -20px rgba(31, 42, 68, .45); cursor: pointer;
    transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease; }
  .card::before { content: ""; position: absolute; top: -1px; left: 22px; right: 22px; height: 4px; border-radius: 0 0 4px 4px; background: var(--tone); }
  .card:hover { transform: translateY(-3px); box-shadow: 0 2px 4px rgba(31, 42, 68, .08), 0 22px 32px -20px rgba(31, 42, 68, .5); }
  .card:focus-visible { outline: 3px solid var(--amber); outline-offset: 3px; }
  .card.on { border-color: var(--amber); }
  .card.sel { border-color: var(--amber); box-shadow: 0 0 0 4px var(--amber-soft), 0 22px 32px -20px rgba(184, 114, 15, .55); }
  .lbl { min-height: 24px; margin: 0 2px 8px; font: 600 15px/1.3 var(--sans); letter-spacing: -.015em; text-align: center; font-variant-numeric: tabular-nums; }
  .lbl .g.good { color: var(--good); } .lbl .g.bad { color: var(--bad); }
  .eyebrow { display: block; font: 600 10.5px/1 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: rgba(255, 255, 255, .72); margin-bottom: 5px; }
  .card svg.mb { display: block; width: 194px; height: 194px; border-radius: 8px; box-shadow: 0 0 0 1px rgba(31, 42, 68, .08); }
  .card.root { background: var(--tone); border-color: var(--tone); color: #fff; box-shadow: 0 16px 30px -18px var(--tone); }
  .card.root::before { display: none; }
  .card.root .lbl .g { color: #fff; }
  .door-go { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 9px; padding: 10px 0; border-radius: 999px;
    background: var(--go); color: #fff; font: 600 14px/1.2 var(--sans); transition: transform .18s ease, box-shadow .18s ease; }
  .card.door:hover .door-go { transform: translateY(-1px); box-shadow: 0 8px 16px -10px var(--go); }

  /* Results at the end of a line. */
  .res { margin-top: 9px; font: 600 13px/1.3 var(--sans); text-align: center; color: var(--navy); }
  .res.mate { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 0; border-radius: 999px; background: var(--navy); color: #fff; }
  .res.mate svg { width: 22px; height: 22px; }
  .res .cut { display: block; font-weight: 500; color: var(--muted); font-size: 12.5px; margin-bottom: 5px; }
  .wbar { display: flex; height: 10px; border-radius: 999px; overflow: hidden; box-shadow: inset 0 0 0 1.5px var(--navy); margin-bottom: 6px; }
  .wbar i { display: block; min-width: 0; }
  .wbar .w { background: #fff; } .wbar .d { background: #c4cad6; } .wbar .b { background: var(--navy); }

  /* Pip the pawn: an original Elvyn character who explains the boards. */
  .pip { display: block; overflow: visible; }
  .pip .bodyg { transform-box: view-box; transform-origin: 60px 146px; animation: bob 2.8s ease-in-out infinite; }
  .pip .eyes { transform-box: fill-box; transform-origin: center; animation: blink 4.6s infinite; }
  .pip .mouth { transform-box: fill-box; transform-origin: center; }
  .pip .m-o, .pip .m-big, .pip .brows, .pip .crown, .pip .arms { display: none; }
  .pip[data-mood="oops"] .m-smile { display: none; } .pip[data-mood="oops"] .m-o, .pip[data-mood="oops"] .brows { display: inline; }
  .pip[data-mood="cheer"] .m-smile { display: none; } .pip[data-mood="cheer"] .m-big, .pip[data-mood="cheer"] .crown, .pip[data-mood="cheer"] .arms { display: inline; }
  .pip[data-mood="happy"] .m-smile { stroke-width: 5; }
  .pip.talking .mouth { animation: talk .22s ease-in-out 6 alternate; }
  .pip.anim[data-mood="cheer"] .bodyg { animation: jump .5s cubic-bezier(.3, 1.6, .5, 1) 2, bob 2.8s ease-in-out 1s infinite; }
  .pip.anim[data-mood="oops"] .bodyg { animation: shake .45s ease-in-out 1, bob 2.8s ease-in-out .45s infinite; }
  .pip.anim[data-mood="happy"] .bodyg { animation: hop .4s ease-out 1, bob 2.8s ease-in-out .4s infinite; }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  @keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
  @keyframes talk { from { transform: scaleY(1); } to { transform: scaleY(.35); } }
  @keyframes jump { 0%, 100% { transform: translateY(0) scale(1); } 40% { transform: translateY(-18px) scale(1.04, .96); } }
  @keyframes hop { 0%, 100% { transform: translateY(0); } 45% { transform: translateY(-8px); } }
  @keyframes shake { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-7deg); } 75% { transform: rotate(7deg); } }
  @media (prefers-reduced-motion: reduce) { .pip * { animation: none !important; } }

  .bubble { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 12px 16px 13px;
    box-shadow: 0 1px 2px rgba(31, 42, 68, .06), 0 18px 34px -20px rgba(31, 42, 68, .5); font: 400 16px/1.45 var(--sans); letter-spacing: -.005em; }
  .bubble::before { content: ""; position: absolute; left: -8px; bottom: 28px; width: 14px; height: 14px; background: var(--surface);
    border-left: 1px solid var(--line); border-bottom: 1px solid var(--line); transform: rotate(45deg); border-radius: 0 0 0 3px; }
  .bubble .who { display: block; width: fit-content; font: 600 10.5px/1 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--amber-deep);
    background: var(--amber-soft); padding: 4px 8px; border-radius: 999px; margin-bottom: 7px; }
  .bubble .mv { display: block; font: 600 18px/1.25 var(--sans); letter-spacing: -.02em; margin-bottom: 3px; font-variant-numeric: tabular-nums; }
  .bubble .mv .g.good { color: var(--good); } .bubble .mv .g.bad { color: var(--bad); }
  .bubble.pop { animation: pop .32s cubic-bezier(.2, 1.4, .4, 1); }
  @keyframes pop { from { transform: scale(.9); opacity: .3; } }

  /* Pip sits in the corner of the map. Tap Pip to hide or show the speech bubble. */
  .dock { position: fixed; left: 24px; bottom: 24px; z-index: 30; display: flex; align-items: flex-end; gap: 10px; pointer-events: none; }
  .dock .pip { width: 104px; height: 128px; pointer-events: auto; cursor: pointer; filter: drop-shadow(0 8px 10px rgba(31, 42, 68, .18)); }
  .dock .bubble { max-width: min(360px, calc(100vw - 150px)); margin-bottom: 30px; pointer-events: none; }
  @media (max-width: 640px) { .dock { left: 10px; bottom: 12px; } .dock .pip { width: 76px; height: 94px; } .dock .bubble { font-size: 15px; margin-bottom: 18px; } }

  /* Big view of one board */
  #big { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; padding: 16px;
    background: rgba(31, 42, 68, .48); backdrop-filter: blur(3px); animation: fade .18s ease; }
  @keyframes fade { from { opacity: 0; } }
  .sheet { position: relative; display: grid; grid-template-columns: auto 370px; gap: 24px; max-width: 100%; max-height: 100%; overflow: auto;
    background: var(--paper); border-radius: 26px; padding: 24px; box-shadow: 0 40px 80px -30px rgba(15, 20, 35, .6); }
  .sheet::before { content: ""; position: absolute; top: 0; left: 40px; right: 40px; height: 5px; border-radius: 0 0 5px 5px; background: var(--tone); }
  @media (max-width: 900px) { .sheet { grid-template-columns: 1fr; } }
  .x { position: absolute; top: 14px; right: 14px; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line-2); background: var(--surface); font-size: 20px; line-height: 1; }
  .x:hover { border-color: var(--navy); }
  .bcol { display: flex; flex-direction: column; gap: 12px; }
  #bb { display: block; width: min(74vh, 500px, calc(100vw - 76px)); aspect-ratio: 1; border-radius: 12px; box-shadow: 0 0 0 1px rgba(31, 42, 68, .08), 0 18px 34px -20px rgba(31, 42, 68, .55); }
  .ctl { display: grid; grid-template-columns: .7fr 1fr 1.3fr; gap: 8px; }
  .ctl button { height: 50px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--surface); font-size: 16px; font-weight: 500;
    transition: transform .18s ease, border-color .18s ease; }
  .ctl button:hover:not(:disabled) { transform: translateY(-1px); border-color: var(--navy); }
  .ctl button.primary { background: var(--navy); border-color: var(--navy); color: #fff; font-weight: 600; }
  .ctl button:disabled { opacity: .35; cursor: default; }
  .rcol { display: flex; flex-direction: column; gap: 14px; padding-top: 38px; min-width: 0; }
  .where { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--muted); font-weight: 500; }
  .where::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--tone); }
  .talkrow { display: flex; align-items: flex-end; gap: 10px; }
  .talkrow .pip { flex: none; width: 82px; height: 101px; }
  .talkrow .bubble { flex: 1; margin-bottom: 22px; min-height: 92px; }
  #bnext { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 14px; color: var(--muted); }
  #bnext b { width: 100%; color: var(--navy); font-size: 15px; font-weight: 600; }
  #bnext button { height: 42px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--surface); font-weight: 600; font-size: 15px;
    transition: transform .18s ease, border-color .18s ease; }
  #bnext button:hover { transform: translateY(-1px); border-color: var(--navy); }
  #bnext button.go { background: var(--navy); border-color: var(--navy); color: #fff; }
  #bnext .res { width: 100%; text-align: left; font-size: 15px; }
  #bnext .res.mate { width: auto; padding: 9px 18px; }
  #bnext .wbar { height: 16px; }
  #bmoves { font-size: 14px; line-height: 1.9; color: var(--muted); font-variant-numeric: tabular-nums; }
  #bmoves .m { cursor: pointer; border-radius: 6px; padding: 1px 4px; }
  #bmoves .m:hover { background: var(--amber-soft); color: var(--navy); }
  #bmoves .m.cur { background: var(--amber); color: #fff; font-weight: 600; }
  #bmoves .m.here { color: var(--navy); font-weight: 600; }
</style>
</head>

// ------------------------------------------------------------------ boards
function parseFen(fen) {
  const map = {};
  fen.split(' ')[0].split('/').forEach((row, i) => {
    let f = 0;
    for (const ch of row) { if (/\d/.test(ch)) f += +ch; else { map['abcdefgh'[f] + (8 - i)] = ch; f++; } }
  });
  return map;
}
const sqXY = (sq) => [sq.charCodeAt(0) - 97, 8 - +sq[1]];

// A board as SVG: squares, the step's moves (earlier one pale, last one yellow), a red glow on a king in check, pieces.
function boardSVG(fen, plies, coords) {
  let s = `<rect width="8" height="8" fill="var(--dk)"/>`;
  for (let r = 0; r < 8; r++) for (let f = 0; f < 8; f++) if ((r + f) % 2 === 0) s += `<rect x="${f}" y="${r}" width="1" height="1" fill="var(--lt)"/>`;
  plies.forEach((p, i) => {
    const last = i === plies.length - 1;
    for (const sq of [p.u.slice(0, 2), p.u.slice(2, 4)]) {
      const [x, y] = sqXY(sq), light = (x + y) % 2 === 0;
      s += `<rect x="${x}" y="${y}" width="1" height="1" fill="var(--${last ? 'hl' : 'hl2'}-${light ? 'lt' : 'dk'})"/>`;
    }
  });
  const map = parseFen(fen);
  const lastPly = plies[plies.length - 1];
  if (lastPly && /[+#]$/.test(lastPly.s)) {
    const k = fen.split(' ')[1] === 'w' ? 'K' : 'k', ksq = Object.keys(map).find((q) => map[q] === k);
    if (ksq) { const [x, y] = sqXY(ksq); s += `<circle cx="${x + .5}" cy="${y + .5}" r=".5" fill="url(#chk)"/>`; }
  }
  for (const sq in map) {
    const [x, y] = sqXY(sq), p = map[sq];
    s += `<use href="#ps-${p === p.toUpperCase() ? 'w' : 'b'}${p.toLowerCase()}" x="${x}" y="${y}" width="1" height="1"/>`;
  }
  if (coords) for (let i = 0; i < 8; i++) {
    s += `<text x="${i + .95}" y="7.94" font-size=".19" text-anchor="end" font-family="system-ui,sans-serif" font-weight="600" fill="${i % 2 ? 'var(--dk)' : 'var(--lt)'}">${'abcdefgh'[i]}</text>`;
    s += `<text x=".05" y="${i + .22}" font-size=".19" font-family="system-ui,sans-serif" font-weight="600" fill="${i % 2 ? 'var(--lt)' : 'var(--dk)'}">${8 - i}</text>`;
  }
  return s;
}

function label(plies) {
  return plies.map((p, i) => {
    const num = p.n.endsWith('.') || i === 0 ? p.n : '';
    return `${esc(num)}${esc(p.s)}${p.g ? `<span class="g ${glyphCls(p.g)}">${esc(p.g)}</span>` : ''}`;
  }).join(' ');
}

function resultHTML(r, big) {

  const [w, d, l] = r.wdl.map((x) => Math.round(x / 10));
  const text = w >= 70 ? `White wins ${w}%` : l >= 70 ? `Black wins ${l}%` : d >= 50 ? `Draw ${d}%` : `White ${w}% · Black ${l}%`;
  const cut = r.cut ? '<span class="cut">The game goes on…</span>' : '';
  return `<div class="res">${cut}<div class="wbar"><i class="w" style="flex:${w}"></i><i class="d" style="flex:${d}"></i><i class="b" style="flex:${l}"></i></div>${big ? `White wins ${w}% · Draw ${d}% · Black wins ${l}%` : text}</div>`;
}

// ------------------------------------------------------------------ the map
const canvas = $('canvas'), sizer = $('sizer'), scroller = $('scroller');

function showMap(i) {
  mi = i;
  const g = MAPS[mi], tone = TONES[g.id];
  document.body.style.setProperty('--tone', tone);
  document.querySelectorAll('.tab').forEach((t, j) => t.setAttribute('aria-pressed', String(j === mi)));
  let html = '<svg class="links" id="links"></svg>';
  for (const n of g.nodes) {
    const r = n.result ? { ...n.result, cut: n.cut } : null;
    const lbl = n.root ? `<span class="eyebrow">Start here</span>${n.plies.length ? label(n.plies) : 'New game'}` : label(n.plies);
    html += `<div class="card${n.root ? ' root' : ''}${n.door ? ' door' : ''}" data-id="${n.id}" tabindex="0" role="button" style="--tone:${tone}${n.door ? `;--go:${TONES[n.door]}` : ''}">`
      + `<div class="lbl">${lbl}</div><svg class="mb" viewBox="0 0 8 8" aria-hidden="true">${boardSVG(n.fen, n.plies, false)}</svg>`
      + resultHTML(r, false)
      + (n.door ? `<span class="door-go">Go to ${esc(MAPS[mapIndex(n.door)].title)} →</span>` : '')
      + '</div>';
  }
  canvas.innerHTML = html;
  zoom = 1;
  layout();
  sel = null;
  lastSaid = null;
  pipSays(g.nodes[0]);
  const p = pos[0];
  scroller.scrollTo({ left: Math.max(0, (p.x + W / 2) * zoom + marginLeft() - scroller.clientWidth / 2), top: 0 });
}

function layout() {
  const g = MAPS[mi];
  pos = {};
  let col = 0;
  const place = (id) => {
    const n = g.nodes[id];
    let x;
    if (!n.kids.length) x = col++ * COL;
    else { n.kids.forEach(place); x = (pos[n.kids[0]].x + pos[n.kids[n.kids.length - 1]].x) / 2; }
    pos[id] = { x, y: n.depth * ROW };
  };
  place(0);
  CW = 0; CH = 0;
  canvas.querySelectorAll('.card').forEach((el) => {
    const p = pos[+el.dataset.id];
    p.x += PAD; p.y += PAD; p.h = el.offsetHeight;
    el.style.left = p.x + 'px'; el.style.top = p.y + 'px';
    CW = Math.max(CW, p.x + W + PAD); CH = Math.max(CH, p.y + p.h + PAD + 140); // room under the last row for Pip
  });
  canvas.style.width = CW + 'px'; canvas.style.height = CH + 'px';
  const svg = $('links');
  svg.setAttribute('width', CW); svg.setAttribute('height', CH);
  let s = '';
  for (const n of g.nodes) if (n.parent != null) {
    const a = pos[n.parent], b = pos[n.id];
    const x1 = a.x + W / 2, y1 = a.y + a.h, x2 = b.x + W / 2, y2 = b.y, my = (y1 + y2) / 2;
    s += `<path data-to="${n.id}" d="M${x1} ${y1}C${x1} ${my} ${x2} ${my} ${x2} ${y2}"/>`;
  }
  svg.innerHTML = s;
  edges = {};
  svg.querySelectorAll('path').forEach((p) => { edges[p.dataset.to] = p; });
  applyZoom();
}

const marginLeft = () => Math.max(0, (scroller.clientWidth - CW * zoom) / 2);
function applyZoom() {
  canvas.style.transform = `scale(${zoom})`;
  sizer.style.width = CW * zoom + 'px'; sizer.style.height = CH * zoom + 'px';
  sizer.style.marginLeft = marginLeft() + 'px'; // a narrow map sits in the middle
}

// Zoom around a point on screen (the middle by default), so the board you're looking at stays put.
function setZoom(z, cx = scroller.clientWidth / 2, cy = scroller.clientHeight / 2) {
  z = Math.max(.35, Math.min(1.6, +z.toFixed(2)));
  const px = (scroller.scrollLeft + cx - marginLeft()) / zoom, py = (scroller.scrollTop + cy) / zoom;
  zoom = z;
  applyZoom();
  scroller.scrollLeft = px * zoom + marginLeft() - cx;
  scroller.scrollTop = py * zoom - cy;
}
$('zin').onclick = () => setZoom(zoom + .15);
$('zout').onclick = () => setZoom(zoom - .15);
$('zfit').onclick = () => { setZoom(Math.min(1, (scroller.clientWidth - 12) / CW, (scroller.clientHeight - 12) / CH)); scroller.scrollTo({ left: 0, top: 0 }); };
scroller.addEventListener('wheel', (e) => {
  if (!e.ctrlKey) return; // ctrl + wheel (or a trackpad pinch) zooms
  e.preventDefault();
  const r = scroller.getBoundingClientRect();
  setZoom(zoom * (e.deltaY < 0 ? 1.1 : .9), e.clientX - r.left, e.clientY - r.top);
}, { passive: false });

// Light up the way from the top of the map to a board.
function lightPath(id) {
  const g = MAPS[mi];
  const on = new Set();
  for (let n = id; n != null; n = g.nodes[n].parent) on.add(n);
  canvas.querySelectorAll('.card').forEach((el) => el.classList.toggle('on', id != null && on.has(+el.dataset.id)));
  for (const k in edges) edges[k].classList.toggle('on', id != null && on.has(+k));
}

let hoverT = null;
canvas.addEventListener('mouseover', (e) => {
  const c = e.target.closest('.card');
  if (!c) return;
  lightPath(+c.dataset.id);
  clearTimeout(hoverT);
  hoverT = setTimeout(() => pipSays(MAPS[mi].nodes[+c.dataset.id]), 140);
});
canvas.addEventListener('mouseleave', () => { clearTimeout(hoverT); lightPath(sel); });
canvas.addEventListener('click', (e) => { const c = e.target.closest('.card'); if (c && !moved) openCard(+c.dataset.id); });
canvas.addEventListener('keydown', (e) => { const c = e.target.closest('.card'); if (c && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openCard(+c.dataset.id); } });

function openCard(id) {
  const n = MAPS[mi].nodes[id];
  if (n.door) { closeBig(); showMap(mapIndex(n.door)); return; }
  openBig(id);
}

// Drag to pan (a drag is not a click).
let drag = null, moved = false;
scroller.addEventListener('pointerdown', (e) => {
  if (e.button !== 0) return;
  drag = { x: e.clientX, y: e.clientY, l: scroller.scrollLeft, t: scroller.scrollTop };
  moved = false;
});
window.addEventListener('pointermove', (e) => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!moved && Math.hypot(dx, dy) > 6) { moved = true; scroller.classList.add('drag'); }
  if (moved) { scroller.scrollLeft = drag.l - dx; scroller.scrollTop = drag.t - dy; }
});
window.addEventListener('pointerup', () => { drag = null; scroller.classList.remove('drag'); setTimeout(() => { moved = false; }, 0); });

// ------------------------------------------------------------------ big view: step through the moves to this board
const B = { id: 0, k: 0, plies: [], segs: [] };

// Every move from 1.e4 to the end of board `id`, plus which board (and Pip line) each move belongs to.
function pathInfo(id) {
  const g = MAPS[mi], chain = [];
  for (let n = id; n != null; n = g.nodes[n].parent) chain.unshift(n);
  const plies = [...g.prefix];
  const segs = g.prefixSay.map((s) => ({ ...s }));
  for (const n of chain) {
    const nd = g.nodes[n];
    if (nd.root) continue;
    segs.push({ a: plies.length, b: plies.length + nd.plies.length, say: nd.say, mood: nd.mood, node: n });
    plies.push(...nd.plies);
  }
  return { plies, segs };
}

function openBig(id) {
  sel = id;
  canvas.querySelectorAll('.card').forEach((el) => el.classList.toggle('sel', +el.dataset.id === id));
  lightPath(id);
  const info = pathInfo(id);
  B.id = id; B.plies = info.plies; B.segs = info.segs; B.k = B.plies.length;
  $('big').hidden = false;
  $('dock').hidden = true; // the big view has its own Pip
  drawBig(true);
}
function closeBig() {
  $('big').hidden = true;
  $('dock').hidden = false;
  if (sel != null) { lastSaid = null; pipSays(MAPS[mi].nodes[sel]); }
}

let lastSeg = null;
function drawBig(force) {
  const g = MAPS[mi], n = g.nodes[B.id], P = B.plies, k = B.k, st = P[k - 1];
  const fen = st ? st.f : START;
  $('bb').innerHTML = boardSVG(fen, st ? [st] : [], true);
  $('where').textContent = `${g.title} map · board ${n.depth + 1}`;

  // Pip explains the board this move belongs to (the line stays while you step through that board's moves).
  const seg = k === 0 ? null : B.segs.find((s) => k - 1 >= s.a && k - 1 < s.b);
  const moveHTML = st ? `${esc(st.n)}${esc(st.s)}${st.g ? `<span class="g ${glyphCls(st.g)}">${esc(st.g)}</span>` : ''}` : '';
  if (force || seg !== lastSeg || !seg) {
    const text = seg ? seg.say : "Let's start! Press Next to play the first move.";
    const mood = seg ? (k - 1 === seg.b - 1 ? seg.mood : 'talk') : 'happy';
    speak($('pip2'), $('say2'), mood, sayHTML(moveHTML, text));
  } else {
    $('say2').querySelector('.mv').innerHTML = moveHTML;
    if (k - 1 === seg.b - 1 && $('pip2').dataset.mood !== seg.mood) speak($('pip2'), $('say2'), seg.mood, sayHTML(moveHTML, seg.say));
  }
  lastSeg = seg;

  const atEnd = k === P.length;
  let next = '';
  if (atEnd) {
    if (n.kids.length) next = `<b>${n.kids.length > 1 ? 'Pick a path' : 'Next board'}</b>` + n.kids.map((c, i) => {
      const kid = g.nodes[c];
      return `<button data-kid="${c}" class="${i === 0 ? 'go' : ''}">${label(kid.plies)}${kid.door ? ' →' : ''}</button>`;
    }).join('');
    else if (n.result) next = `<b>${n.cut ? 'The game goes on, but the map stops here.' : 'The end'}</b>` + resultHTML({ ...n.result, cut: false }, true);
  } else next = `<span>${P.length - k} more move${P.length - k > 1 ? 's' : ''} to this board.</span>`;
  $('bnext').innerHTML = next;
  const here = P.length - (n.root ? 0 : n.plies.length);
  $('bmoves').innerHTML = P.map((p, i) =>
    `<span class="m${i === k - 1 ? ' cur' : ''}${i >= here ? ' here' : ''}" data-k="${i + 1}">${esc(p.n.endsWith('.') || i === 0 ? p.n + ' ' : '')}${esc(p.s)}${esc(p.g)}</span>`).join(' ');
  $('bfirst').disabled = $('bprev').disabled = k === 0;
  $('bnext-btn').disabled = atEnd && !n.kids.length;
}

function bigStep(d) {
  const n = MAPS[mi].nodes[B.id];
  if (d > 0 && B.k === B.plies.length) {
    if (!n.kids.length) return;
    return goKid(n.kids[0]);
  }
  B.k = Math.max(0, Math.min(B.plies.length, B.k + d));
  drawBig();
}
function goKid(id) {
  const kid = MAPS[mi].nodes[id];
  if (kid.door) { closeBig(); showMap(mapIndex(kid.door)); return; }
  const k = B.plies.length;
  openBig(id);
  B.k = k + 1; // play the first move of the new board
  drawBig(true);
  const p = pos[id];
  scroller.scrollTo({ left: Math.max(0, (p.x + W / 2) * zoom + marginLeft() - scroller.clientWidth / 2), top: Math.max(0, (p.y + p.h / 2) * zoom - scroller.clientHeight / 2), behavior: 'smooth' });
}

$('bnext-btn').onclick = () => bigStep(1);
$('bprev').onclick = () => bigStep(-1);
$('bfirst').onclick = () => { B.k = 0; drawBig(); };
$('close').onclick = closeBig;
$('big').addEventListener('click', (e) => { if (e.target.id === 'big') closeBig(); });
$('bnext').addEventListener('click', (e) => { const b = e.target.closest('[data-kid]'); if (b) goKid(+b.dataset.kid); });
$('bmoves').addEventListener('click', (e) => { const m = e.target.closest('.m'); if (m) { B.k = +m.dataset.k; drawBig(); } });
document.addEventListener('keydown', (e) => {
  if ($('big').hidden || e.altKey || e.ctrlKey || e.metaKey) return;
  const act = { ArrowRight: () => bigStep(1), ArrowLeft: () => bigStep(-1), Escape: closeBig, Home: () => { B.k = 0; drawBig(); } }[e.key];
  if (act) { e.preventDefault(); act(); }
});

// ------------------------------------------------------------------ tabs
$('bar').insertAdjacentHTML('afterbegin', MAPS.map((m, i) =>
  `<button class="tab" data-i="${i}" aria-pressed="false" style="--tone:${TONES[m.id]}"><i></i>${esc(m.title)}</button>`).join(''));
document.querySelectorAll('.tab').forEach((t) => (t.onclick = () => { closeBig(); showMap(+t.dataset.i); }));
window.addEventListener('resize', () => applyZoom());

showMap(0);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { layout(); });
</script>
</body>
</html>
