  :root { --amber: #d97706; --amber-soft: #fef3c7; --ink: #1c1917; --muted: #78716c; --line: #e7e5e4; --bg: #faf9f7;
          --good: #15803d; --bad: #b91c1c; --alt: #b45309;
          /* Geist: the marketing site's stand-in for the Figma's Neue Haas Grotesk / Suisse Int'l. */
          --sans: "Geist", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
          --mono: "Geist Mono", ui-monospace, "SFMono-Regular", Consolas, monospace; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { overflow-x: clip; } /* fanned sheets never cause sideways scrolling */
  body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.5 var(--sans); letter-spacing: -.01em;
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
  button { touch-action: manipulation; font: inherit; color: var(--ink); cursor: pointer; }
  /* Top bar: Elvyn logo on the left, page title centred (same black badge as the portal's BrandLogo). */
  .topbar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; max-width: 1180px; margin: 0 auto; padding: 16px 20px 4px; }
  .logo { justify-self: start; display: inline-flex; align-items: center; height: 40px; padding: 0 10px; background: #000; border-radius: 10px; }
  .logo img { display: block; height: 28px; width: auto; }
  .topbar h1 { grid-column: 2; margin: 0; text-align: center; font: 400 clamp(26px, 3vw, 36px)/1.08 var(--sans); letter-spacing: -.03em; }
  @media (max-width: 600px) {
    .topbar { grid-template-columns: 1fr; justify-items: center; gap: 10px; padding-top: 14px; }
    .topbar h1 { grid-column: auto; font-size: 22px; }
    .logo { justify-self: center; height: 34px; } .logo img { height: 23px; }
  }

  /* Home: console panel + level folders */
  #home { max-width: 1180px; margin: 0 auto; padding: 18px 20px 36px; display: grid; gap: 26px; }
  @media (min-width: 900px) { #home { grid-template-columns: 300px minmax(0, 1fr); align-items: start; } .console { position: sticky; top: 20px; } }

  /* The guide is a dark console, echoing the site's retro touches ("[ 12:34 ]" clock, dithered loader bar). */
  .console { position: relative; overflow: hidden; color: #ededed; background: #141414; border-radius: 18px; padding: 22px 20px 18px;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .07), 0 24px 44px -20px rgba(0, 0, 0, .6); }
  .console::before { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(180deg, rgba(255, 255, 255, .022) 0 1px, transparent 1px 3px); }
  .console > * { position: relative; }
  .eyebrow { margin: 0 0 18px; font: 500 11px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: #8c8c8c; }
  .rules { list-style: none; margin: 0 0 24px; padding: 0; display: grid; gap: 12px; }
  .rules li { display: flex; align-items: center; gap: 12px; font-size: 15px; line-height: 1.35; color: #f4f4f4; }
  .rules .ico { flex: none; width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center;
    background: linear-gradient(180deg, #f6f6f5, #d9d9d6); box-shadow: inset 0 1px 0 #fff, 0 3px 8px rgba(0, 0, 0, .4); }
  .rules .ico svg { width: 26px; height: 26px; display: block; }
  .rules .ico.star { background: linear-gradient(180deg, #fbbf24, #d97706); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .45), 0 3px 8px rgba(0, 0, 0, .4); }
  .rules .ico.star svg { width: 20px; height: 20px; }

  /* Progress meter: dithered track, a solid block fill that grows in retro steps, a blinking cursor, zero-padded percent. */
  .meter { display: flex; align-items: center; gap: 12px; }
  .track { position: relative; flex: 1; height: 16px; background: repeating-conic-gradient(#3d3d3d 0 25%, #1a1a1a 0 50%) 0 0 / 2px 2px; }
  .track i { position: relative; display: block; height: 100%; width: 0; background: #efefef; transition: width 1.2s steps(16, end); }
  .track i::after { content: ""; position: absolute; top: 0; right: -7px; width: 5px; height: 100%; background: #efefef; animation: blink 1.05s steps(2, start) infinite; }
  @keyframes blink { to { visibility: hidden; } }
  .pct { min-width: 4ch; text-align: right; font: 500 15px/1 var(--mono); color: #dadada; font-variant-numeric: tabular-nums; letter-spacing: .02em; }
  .caption { margin: 12px 0 24px; font: 500 11px/1.5 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: #8c8c8c; }
  .caption b { color: #fbbf24; font-weight: 500; }

  /* Site-style pill CTA (www.elvynchess.com Button, light variant on a dark surface). */
  #continue { width: 100%; height: 52px; display: flex; align-items: center; justify-content: center; gap: 10px; border: 0; border-radius: 999px;
    background: #fff; color: #111; font: 500 16px/1 var(--sans); letter-spacing: -.01em;
    box-shadow: 0 0 0 1px rgba(255, 255, 255, .14), 0 10px 24px -12px rgba(255, 255, 255, .35);
    transition: transform .18s ease, box-shadow .18s ease; }
  #continue:hover { transform: scale(1.02); }
  #continue:active { transform: scale(.985); }
  #continue:focus-visible { outline: 2px solid #fbbf24; outline-offset: 3px; }
  #continue .arrow { display: inline-block; transition: transform .2s ease; }
  #continue:hover .arrow { transform: translateX(3px); }
  .next-up { margin: 10px 0 0; text-align: center; font: 500 11px/1.4 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: #9b9b9b; }
  .kbd-hint { margin: 18px 0 0; padding-top: 14px; border-top: 1px dashed #2f2f2f; text-align: center;
    font: 500 10.5px/1.6 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: #6f6f6f; }
  .kbd-hint kbd { font: inherit; color: #d4d4d4; border: 1px solid #3b3b3b; border-bottom-width: 2px; border-radius: 4px; padding: 1px 5px; }
  .kbd-hint .touch { display: none; }
  @media (hover: none) { .kbd-hint .keys { display: none; } .kbd-hint .touch { display: inline; } }

  .levels { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 30px 16px; padding-top: 10px; }
  @media (min-width: 640px) { .levels { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 40px 26px; } }
  @media (min-width: 900px) and (max-width: 1080px) { .levels { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

  /* A level is a slate metal folder; each line is a mini chessboard card inside it. Hover/focus fans the cards out. */
  .folder { --slate-top: #4f5f73; --slate-bot: #3b4757;
    position: relative; display: block; width: 100%; aspect-ratio: 5 / 4; padding: 0; border: 0; background: none;
    text-align: left; perspective: 900px; -webkit-tap-highlight-color: transparent; outline: none;
    animation: rise .5s cubic-bezier(.2, .9, .25, 1) both; animation-delay: calc(var(--i) * 60ms); }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } }
  /* Back panel + tab with a sloped shoulder, like a real file folder. */
  .folder .back { position: absolute; left: 0; right: 0; top: 11%; bottom: 0; border-radius: 4px 14px 14px 14px;
    background: linear-gradient(180deg, var(--slate-top), var(--slate-bot)); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .18); }
  .folder .back::before { content: ""; position: absolute; left: 0; top: -10%; width: 34%; height: 12%; background: var(--slate-top);
    border-radius: 10px 0 0 0; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .18); }
  .folder .back::after { content: ""; position: absolute; left: 31%; top: -10%; width: 14%; height: 12%; background: var(--slate-top);
    border-radius: 0 10px 0 0; transform: skewX(34deg); transform-origin: 0 100%; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .18); }
  .folder .tabno { position: absolute; left: 12px; top: 3.6%; z-index: 15; font: 600 11px/1 var(--sans); letter-spacing: .04em;
    color: #dbe3ec; transition: opacity .2s ease; }
  .folder.complete .tabno { top: 2.4%; left: 9px; width: 18px; height: 18px; border-radius: 50%; background: var(--good); color: #fff;
    font-size: 11px; line-height: 18px; text-align: center; letter-spacing: 0; box-shadow: 0 0 0 2px rgba(255, 255, 255, .85); }
  .folder:hover .tabno, .folder:focus-visible .tabno, .folder.opening .tabno { opacity: 0; }
  .folder .files { position: absolute; left: 0; right: 0; top: 12%; bottom: 0; }
  /* Each line is a mini chessboard card tucked into the folder, showing the position where that line branches off. */
  .folder .file { position: absolute; left: 20%; width: 60%; top: 0; aspect-ratio: 1; padding: 3.5%; border-radius: 5px; background: #fff;
    box-shadow: 0 1px 4px rgba(0, 0, 0, .22);
    transform: translateY(var(--y)) rotate(var(--r));
    transition: transform .45s cubic-bezier(.2, .9, .3, 1.2); transition-delay: var(--d); }
  .folder .file svg { display: block; width: 100%; height: 100%; border-radius: 2px; }
  .folder .file.done::after { content: "✓"; position: absolute; top: -7px; right: -7px; width: 20px; height: 20px; border-radius: 50%;
    background: var(--good); color: #fff; font: 700 12px/20px var(--sans); letter-spacing: 0; text-align: center; box-shadow: 0 0 0 2px #fff; }
  /* Front panel: brushed slate metal with a bevelled top edge; the title sits on an engraved name plate. */
  .folder .front { position: absolute; left: 0; right: 0; bottom: 0; height: 62%; z-index: 20; display: flex; align-items: flex-end;
    padding: 12px 14px; border-radius: 9px 9px 14px 14px; overflow: hidden;
    background: linear-gradient(180deg, #93a3b6 0%, #75869a 34%, #5c6b7e 100%);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .6), inset 0 -10px 18px -10px rgba(15, 23, 42, .45),
      0 14px 24px -12px rgba(15, 23, 42, .55);
    transform-origin: 50% 100%; transition: transform .45s cubic-bezier(.2, .9, .25, 1), box-shadow .3s ease, filter .3s ease; }
  .folder .front::before { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(90deg, rgba(255, 255, 255, .045) 0 1px, transparent 1px 3px); }
  .folder .front::after { content: ""; position: absolute; top: 0; bottom: 0; left: -75%; width: 55%; pointer-events: none;
    background: linear-gradient(105deg, transparent, rgba(255, 255, 255, .32), transparent); transform: skewX(-14deg);
    transition: left .8s cubic-bezier(.2, .8, .2, 1); }
  .folder .ttl { position: relative; z-index: 1; display: inline-block; max-width: 100%; padding: 6px 11px; border-radius: 7px;
    background: linear-gradient(180deg, #f8fafc, #dfe6ee); border: 1px solid rgba(15, 23, 42, .22);
    box-shadow: inset 0 1px 0 #fff, 0 1px 2px rgba(15, 23, 42, .35);
    font: 500 clamp(14px, 1.7vw, 17px)/1.2 var(--sans); letter-spacing: -.02em; color: #1e293b; }
  .folder:hover .front, .folder:focus-visible .front { transform: rotateX(-16deg); filter: brightness(1.05);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .6), inset 0 -10px 18px -10px rgba(15, 23, 42, .45),
      0 22px 32px -14px rgba(15, 23, 42, .6); }
  .folder:hover .front::after, .folder:focus-visible .front::after { left: 125%; }
  .folder:hover .file, .folder:focus-visible .file { transform: translate(var(--hx), var(--hy)) rotate(var(--hr)); }
  .folder:focus-visible .front { outline: 3px solid var(--amber); outline-offset: 3px; }
  .folder.opening .front { transform: rotateX(-34deg); }
  .folder.opening .file { transform: translate(var(--hx), calc(var(--hy) - 18%)) rotate(var(--hr)); }
  /* Finished level: still slate, with a green edge (green only ever means "done"). */
  .folder.complete .front { box-shadow: inset 0 1px 0 rgba(255, 255, 255, .6), inset 0 -10px 18px -10px rgba(15, 23, 42, .45),
      inset 0 -4px 0 var(--good), 0 14px 24px -12px rgba(15, 23, 42, .55); }
  @media (prefers-reduced-motion: reduce) {
    .folder, .folder .front, .folder .front::after, .folder .file, .track i, .track i::after { animation: none; transition: none; } }

  .side { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--ink); font-size: 12px; font-weight: 600; }
  .side::before { content: ""; width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--ink); }
  .side.w::before { background: #fff; } .side.b::before { background: var(--ink); }
  .side.both::before { background: linear-gradient(90deg, #fff 50%, var(--ink) 50%); }
  .stars { color: var(--amber); font-weight: 700; } .stars.none { color: #a8a29e; font-weight: 400; }

  /* Play view */
  #play { padding: 0 12px 24px; }
  .playbar { max-width: 940px; margin: 0 auto 8px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  #back { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 7px 13px; font-size: 14px; }
  .ptitle { display: flex; flex-direction: column; line-height: 1.2; }
  .ptitle b { font-size: 16px; } .ptitle span { font-size: 13px; color: var(--muted); }
  .playbar .side { margin-left: auto; }
  #dots { max-width: 940px; margin: 0 auto 10px; display: flex; gap: 8px; flex-wrap: wrap; }
  #dots button { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--line); background: #fff; font-weight: 700; font-size: 14px; padding: 0; }
  #dots button.done { background: var(--good); border-color: var(--good); color: #fff; }
  #dots button.on { border-color: var(--amber); box-shadow: 0 0 0 3px var(--amber-soft); }
  main { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  @media (min-width: 900px) { main { flex-direction: row; align-items: flex-start; justify-content: center; } .panel { width: 380px; } }

  /* Board: a static square grid with an absolutely positioned piece layer on top. */
  .boardwrap { position: relative; }
  #board { position: relative; width: min(94vw, 520px, 60vh); aspect-ratio: 1; border-radius: 6px; overflow: hidden;
    box-shadow: 0 2px 10px rgba(0,0,0,.15); touch-action: none; user-select: none; -webkit-user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; cursor: pointer; }
  #sqs { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); }
  .sq { position: relative; }
  .sq.lt { background: #f0d9b5; } .sq.dk { background: #b58863; }
  .sq::before { content: ""; position: absolute; inset: 0; }
  /* Last move: solid yellow, same shades as the printed worksheet. */
  .sq.lt.last { background: #f3dc6b; } .sq.dk.last { background: #d6b545; }
  .sq.sel::before { background: rgba(21, 128, 61, .45); }
  .sq.over::before { box-shadow: inset 0 0 0 4px rgba(255, 255, 255, .85); }
  .sq.bad::before { background: rgba(220, 38, 38, .55); }
  .sq.hint::after { content: ""; position: absolute; inset: 0; box-shadow: inset 0 0 0 4px var(--amber); animation: pulse 1s infinite alternate; }
  @keyframes pulse { from { opacity: .45; } to { opacity: 1; } }
  .sq.dot::after { content: ""; position: absolute; left: 36%; top: 36%; width: 28%; height: 28%; border-radius: 50%; background: rgba(20, 20, 20, .25); }
  .sq.cap::after { content: ""; position: absolute; inset: 0; border-radius: 50%; box-shadow: inset 0 0 0 5px rgba(20, 20, 20, .25); }
  .sq .rk, .sq .fl { position: absolute; font-size: 10px; font-weight: 600; z-index: 1; }
  .sq .rk { top: 2px; left: 3px; } .sq .fl { bottom: 1px; right: 3px; }
  .sq.lt .rk, .sq.lt .fl { color: #b58863; } .sq.dk .rk, .sq.dk .fl { color: #f0d9b5; }
  #pcs { position: absolute; inset: 0; pointer-events: none; }
  .pc { position: absolute; left: 0; top: 0; width: 12.5%; height: 12.5%; background-size: 92%; background-position: center;
    background-repeat: no-repeat; transition: transform .22s ease, opacity .2s ease; will-change: transform; z-index: 2; }
  .pc.drag { transition: none; z-index: 10; filter: drop-shadow(0 4px 6px rgba(0,0,0,.35)); }
  .pc.gone { opacity: 0; }
  #board.noanim .pc { transition: none; }

  /* "Well done" card over the board */
  #doneCard { position: absolute; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center;
    background: rgba(28, 25, 23, .45); border-radius: 6px; animation: fadein .25s ease; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  .dc { background: #fff; border-radius: 16px; padding: 18px 20px; width: min(86%, 340px); text-align: center; box-shadow: 0 8px 30px rgba(0,0,0,.3); }
  .dc .big { font-size: 34px; color: var(--amber); letter-spacing: 4px; }
  .dc .big .off { color: #e7e5e4; }
  .dc h3 { margin: 4px 0 4px; font-size: 20px; }
  .dc p { margin: 0 0 14px; color: var(--muted); font-size: 15px; }
  .dc .row { display: flex; gap: 8px; }
  .dc button { flex: 1; padding: 12px 6px; border-radius: 10px; border: 1px solid var(--line); background: #fff; font-size: 15px; }
  .dc button.primary { background: var(--amber); border-color: var(--amber); color: #fff; font-weight: 700; }

  .panel { width: min(94vw, 520px); display: flex; flex-direction: column; gap: 10px; }
  #status { font-weight: 600; padding: 10px 12px; border-radius: 8px; background: #fff; border: 1px solid var(--line); min-height: 46px; }
  #status.good, #status.done { color: var(--good); border-color: #bbf7d0; background: #f0fdf4; }
  #status.bad { color: var(--bad); border-color: #fecaca; background: #fef2f2; }
  #status.alt { color: var(--alt); border-color: #fde68a; background: #fffbeb; }
  #why { background: #fff; border: 1px solid var(--line); border-left: 3px solid var(--amber); border-radius: 8px; padding: 10px 12px; min-height: 70px; }
  #why b { font-family: var(--mono); }
  #moves { font-family: var(--mono); font-size: 13px; color: var(--muted); min-height: 20px; }
  #moves .cur { color: var(--ink); font-weight: 700; }
  .btns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .btns button { font-size: 15px; padding: 12px 4px; border-radius: 8px; border: 1px solid var(--line); background: #fff; }
  .btns button:disabled { opacity: .4; cursor: default; }
  footer { text-align: center; font-size: 12px; color: var(--muted); padding: 0 16px 20px; }
  /* Buttons: the site's pill style (black primary, white secondary, a slight grow on hover). */
  .btns button, .dc button, #back { border-radius: 999px; font-weight: 500; letter-spacing: -.01em;
    transition: transform .18s ease, background-color .18s ease, border-color .18s ease; }
  .btns button { height: 46px; padding: 0 10px; }
  .btns button:hover:not(:disabled), .dc button:hover, #back:hover { transform: scale(1.02); }
  .btns button:hover:not(:disabled), #back:hover { border-color: #a8a29e; }
  .dc button.primary { background: #111; border-color: #111; color: #fff; }
  .dc button { height: 46px; }
  /* Typography: headings medium with tight tracking, like www.elvynchess.com */
  .ptitle b, .dc h3, #continue b { font-weight: 600; letter-spacing: -.02em; }
  .dc h3 { font-size: 22px; }
  #status { letter-spacing: -.01em; }
</style>
</head>

const KEY = 'elvyn-italian-progress-v2';
const $ = (id) => document.getElementById(id);

// progress[lineId] = best stars (1-3). v1 stored `true` for a finished line.
let progress = {};
try {
  progress = JSON.parse(localStorage.getItem(KEY) || 'null');
  if (!progress) {
    const v1 = JSON.parse(localStorage.getItem('elvyn-italian-progress-v1') || '{}');
    progress = {};
    for (const id in v1) if (v1[id]) progress[id] = 3;
  }
} catch (_) { progress = {}; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(progress)); } catch (_) {} };

// Each startLine bumps gen; timers from an older line become no-ops.
let gen = 0;
const later = (fn, ms) => { const g = gen; setTimeout(() => { if (g === gen) fn(); }, ms); };
const S = { c: 0, l: 0, step: 0, fen: '', last: null, sel: null, wrong: 0, hintSq: null, busy: false, done: false, played: [],
            mistakes: 0, hints: 0, shown: 0 };

const line = () => DATA[S.c].lines[S.l];
const cur = () => line().steps[S.step];
const studentTurn = () => !S.busy && !S.done && !!cur() && cur().by === 's';

function parseFen(fen) {
  const map = {};
  fen.split(' ')[0].split('/').forEach((row, i) => {
    let f = 0;
    for (const ch of row) {
      if (/\d/.test(ch)) f += +ch;
      else { map['abcdefgh'[f] + (8 - i)] = ch; f++; }
    }
  });
  return map;
}
const whiteToMove = () => S.fen.split(' ')[1] === 'w';
const isMine = (p) => !!p && ((p === p.toUpperCase()) === whiteToMove());

// ---------------------------------------------------------------- board view
const boardEl = $('board'), sqsEl = $('sqs'), pcsEl = $('pcs');
const sqEls = {};
let flipped = null;
let pieces = []; // { el, sq, p }

// Piece images live in one stylesheet, so they decode once and never blink.
(function pieceCss() {
  const css = Object.entries(PIECES).map(([p, uri]) => `.pc.p-${p === p.toUpperCase() ? 'w' : 'b'}${p.toLowerCase()} { background-image: url("${uri}"); }`).join('\n');
  const st = document.createElement('style'); st.textContent = css; document.head.appendChild(st);
})();

function xy(sq) {
  const f = sq.charCodeAt(0) - 97, r = +sq[1] - 1;
  return flipped ? [7 - f, r] : [f, 7 - r];
}
function place(el, sq) { const [x, y] = xy(sq); el.style.transform = `translate(${x * 100}%, ${y * 100}%)`; }
const dist = (a, b) => { const [ax, ay] = xy(a), [bx, by] = xy(b); return Math.hypot(ax - bx, ay - by); };

function buildSquares(flip) {
  flipped = flip;
  sqsEl.innerHTML = '';
  for (let r = 0; r < 8; r++) for (let f = 0; f < 8; f++) {
    const sq = 'abcdefgh'[flip ? 7 - f : f] + (flip ? r + 1 : 8 - r);
    const d = document.createElement('div');
    d.className = 'sq ' + ((f + r) % 2 ? 'dk' : 'lt');
    if (f === 0) d.insertAdjacentHTML('beforeend', `<span class="rk">${sq[1]}</span>`);
    if (r === 7) d.insertAdjacentHTML('beforeend', `<span class="fl">${sq[0]}</span>`);
    sqEls[sq] = d;
    sqsEl.appendChild(d);
  }
}

function makePiece(p) {
  const el = document.createElement('div');
  el.className = `pc p-${p === p.toUpperCase() ? 'w' : 'b'}${p.toLowerCase()}`;
  pcsEl.appendChild(el);
  return el;
}

// Move the existing piece elements to match the FEN: keep what didn't move, slide what moved, fade out captures.
function setPosition(fen, animate) {
  const want = parseFen(fen);
  boardEl.classList.toggle('noanim', !animate);
  const bySq = {};
  pieces.forEach((pc) => { bySq[pc.sq] = pc; });
  const next = [], used = new Set(), missing = [];
  for (const sq in want) {
    const pc = bySq[sq];
    if (pc && pc.p === want[sq]) { next.push(pc); used.add(pc); } else missing.push(sq);
  }
  const spare = pieces.filter((pc) => !used.has(pc));
  for (const sq of missing) {
    let best = null;
    for (const pc of spare) if (!used.has(pc) && pc.p === want[sq] && (!best || dist(pc.sq, sq) < dist(best.sq, sq))) best = pc;
    if (best) { used.add(best); best.sq = sq; best.el.classList.remove('drag'); place(best.el, sq); next.push(best); }
    else { const el = makePiece(want[sq]); place(el, sq); next.push({ el, sq, p: want[sq] }); }
  }
  spare.filter((pc) => !used.has(pc)).forEach((pc) => {
    pc.el.classList.add('gone');
    if (animate) setTimeout(() => pc.el.remove(), 230); else pc.el.remove();
  });
  pieces = next;
  if (!animate) { void boardEl.offsetWidth; boardEl.classList.remove('noanim'); }
}

function paintSquares(over) {
  const targets = S.sel && studentTurn() ? cur().legal.filter((u) => u.startsWith(S.sel)).map((u) => u.slice(2, 4)) : [];
  const occ = parseFen(S.fen);
  for (const sq in sqEls) {
    const c = sqEls[sq].classList;
    c.toggle('last', !!S.last && (S.last.slice(0, 2) === sq || S.last.slice(2, 4) === sq));
    c.toggle('sel', S.sel === sq);
    c.toggle('hint', S.hintSq === sq);
    c.toggle('dot', targets.includes(sq) && !occ[sq]);
    c.toggle('cap', targets.includes(sq) && !!occ[sq]);
    c.toggle('over', over === sq);
  }
}

function flashBad(sq) {
  const el = sqEls[sq]; if (!el) return;
  el.classList.add('bad');
  setTimeout(() => el.classList.remove('bad'), 450);
}

// ---------------------------------------------------------------- home view
const sideLabel = (s) => s === 'w' ? 'You play White' : s === 'b' ? 'You play Black' : 'White and Black';
const levelSide = (ch) => { const s = new Set(ch.lines.map((l) => l.side)); return s.size > 1 ? 'both' : [...s][0]; };
const starHtml = (n, of) => '★'.repeat(n) + `<span class="off">${'★'.repeat(Math.max(0, of - n))}</span>`;

function nextUnfinished() {
  for (let c = 0; c < DATA.length; c++)
    for (let l = 0; l < DATA[c].lines.length; l++)
      if (!progress[DATA[c].lines[l].id]) return { c, l };
  return null;
}

// The position a folder card shows for a line: where it branches off from its closest sibling line.
// If the branching move is the student's own, show the position before it so the card never gives the answer away.
function previewFen(ch, j) {
  const ln = ch.lines[j];
  if (ch.id === 'puzzles' || ch.lines.length < 2) return ln.start;
  let div = 0;
  for (const o of ch.lines) {
    if (o === ln) continue;
    let i = 0;
    while (i < ln.steps.length && i < o.steps.length && ln.steps[i].uci === o.steps[i].uci) i++;
    div = Math.max(div, i);
  }
  if (div >= ln.steps.length) return ln.steps.length ? ln.steps[ln.steps.length - 1].fen : ln.start;
  const st = ln.steps[div];
  return st.by === 'a' ? st.fen : div > 0 ? ln.steps[div - 1].fen : ln.start;
}

// A small static board as SVG; pieces reuse the <symbol>s defined once at the top of the page.
const miniCache = {};
function miniBoard(fen, flip) {
  const key = fen + flip;
  if (miniCache[key]) return miniCache[key];
  let s = '<svg viewBox="0 0 8 8" aria-hidden="true"><rect width="8" height="8" fill="#f0d9b5"/>';
  for (let r = 0; r < 8; r++) for (let f = 0; f < 8; f++) if ((r + f) % 2) s += `<rect x="${f}" y="${r}" width="1" height="1" fill="#b58863"/>`;
  const map = parseFen(fen);
  for (const sq in map) {
    const fi = sq.charCodeAt(0) - 97, ri = +sq[1] - 1, p = map[sq];
    const x = flip ? 7 - fi : fi, y = flip ? ri : 7 - ri;
    s += `<use href="#ps-${p === p.toUpperCase() ? 'w' : 'b'}${p.toLowerCase()}" x="${x}" y="${y}" width="1" height="1"/>`;
  }
  return (miniCache[key] = s + '</svg>');
}

function showHome() {
  gen++; drag = null;
  $('play').hidden = true; $('home').hidden = false;
  $('levels').innerHTML = DATA.map((ch, i) => {
    const n = ch.lines.length, done = ch.lines.filter((l) => progress[l.id]).length, mid = (n - 1) / 2;
    // One sheet per line: stacked and slightly turned at rest, fanned out on hover/focus.
    const files = ch.lines.map((l, j) => {
      const k = j - mid;
      const vars = `--y:${(-j * Math.min(5, 14 / n)).toFixed(1)}%;--r:${(k * 1.6).toFixed(1)}deg;--hx:${(k * Math.min(9, 30 / n)).toFixed(1)}%;--hy:${-(22 + j * 5)}%;--hr:${(k * Math.min(5, 16 / n)).toFixed(1)}deg;--d:${j * 35}ms;z-index:${n - j}`;
      return `<span class="file${progress[l.id] ? ' done' : ''}" style="${vars}">${miniBoard(previewFen(ch, j), l.side === 'b')}</span>`;
    }).join('');
    const all = done === n;
    return `<button class="folder${all ? ' complete' : ''}" data-c="${i}" style="--i:${i}" aria-label="Level ${i + 1}: ${ch.title}. ${done} of ${n} done.">
      <span class="back"></span><span class="tabno">${all ? '✓' : i + 1}</span>
      <span class="files">${files}</span>
      <span class="front"><span class="ttl">${ch.title}</span></span>
    </button>`;
  }).join('');
  const total = DATA.reduce((t, ch) => t + ch.lines.length, 0);
  const doneAll = DATA.reduce((t, ch) => t + ch.lines.filter((l) => progress[l.id]).length, 0);
  const starsAll = DATA.reduce((t, ch) => t + ch.lines.reduce((s, l) => s + (progress[l.id] || 0), 0), 0);
  const pct = Math.round(doneAll / total * 100);
  $('pct').textContent = String(pct).padStart(2, '0') + '%';
  $('meter').setAttribute('aria-valuenow', pct);
  $('progText').innerHTML = `${doneAll} / ${total} lines · <b>★ ${starsAll} / ${total * 3}</b>`;
  requestAnimationFrame(() => { $('progBar').style.width = `${pct}%`; });
  const nx = nextUnfinished();
  if (nx) {
    const started = Object.keys(progress).length > 0;
    $('contTitle').textContent = started ? 'Continue' : 'Start with Level 1';
    $('contSub').textContent = `Up next · ${DATA[nx.c].title} · Line ${nx.l + 1}`;
  } else {
    $('contTitle').textContent = 'Play again';
    $('contSub').textContent = 'Every line done · go for 3 stars';
  }
  window.scrollTo(0, 0);
}

$('continue').onclick = () => { const nx = nextUnfinished() || { c: 0, l: 0 }; openLine(nx.c, nx.l); };
$('levels').onclick = (e) => {
  const b = e.target.closest('.folder'); if (!b || b.classList.contains('opening')) return;
  const c = +b.dataset.c, first = DATA[c].lines.findIndex((x) => !progress[x.id]), l = first < 0 ? 0 : first;
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return openLine(c, l);
  b.classList.add('opening'); // the folder opens and the sheets lift, then the level starts
  setTimeout(() => { b.classList.remove('opening'); openLine(c, l); }, 320);
};
$('back').onclick = showHome;

document.addEventListener('keydown', (e) => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  if (!$('play').hidden) { if (e.key === 'Escape') showHome(); return; }
  const folders = [...document.querySelectorAll('.folder')], i = folders.indexOf(document.activeElement);
  if (e.key === 'Enter' && document.activeElement?.tagName !== 'BUTTON') { e.preventDefault(); $('continue').click(); return; }
  const cols = getComputedStyle($('levels')).gridTemplateColumns.split(' ').length;
  const step = { ArrowRight: 1, ArrowLeft: -1, ArrowDown: cols, ArrowUp: -cols }[e.key];
  if (!step) return;
  e.preventDefault();
  folders[i < 0 ? 0 : Math.min(folders.length - 1, Math.max(0, i + step))].focus();
});

// ---------------------------------------------------------------- play view
function openLine(c, l) {
  $('home').hidden = true; $('play').hidden = false;
  startLine(c, l);
  window.scrollTo(0, 0);
}

function setStatus(kind, text) { const s = $('status'); s.className = kind; s.textContent = text; }
function setWhy(html) { $('why').innerHTML = html; }

function renderMoves() {
  const parts = S.played.map((st, i) => (st.num.endsWith('.') ? st.num + ' ' : i === 0 ? st.num + ' ' : '') + st.san);
  $('moves').innerHTML = parts.map((p, i) => i === parts.length - 1 ? `<span class="cur">${p}</span>` : p).join(' ');
}

function renderBar() {
  const ch = DATA[S.c];
  $('lvlTitle').textContent = `Level ${S.c + 1} · ${ch.title}`;
  $('lineInfo').textContent = `${ch.id === 'puzzles' ? 'Puzzle' : 'Line'} ${S.l + 1} of ${ch.lines.length}: ${line().title}`;
  const sb = $('sideBadge'); sb.className = 'side ' + line().side; sb.textContent = sideLabel(line().side);
  $('dots').innerHTML = ch.lines.map((x, i) =>
    `<button class="${progress[x.id] ? 'done' : ''}${i === S.l ? ' on' : ''}" data-l="${i}" aria-label="${x.title}">${progress[x.id] ? '✓' : i + 1}</button>`).join('');
}
$('dots').onclick = (e) => { const b = e.target.closest('button'); if (b) startLine(S.c, +b.dataset.l); };

function updateButtons() {
  const st = studentTurn();
  $('hint').disabled = !st; $('show').disabled = !st;
}

function startLine(c, l) {
  gen++;
  drag = null;
  S.c = c; S.l = l;
  Object.assign(S, { step: 0, fen: line().start, last: line().last || null, sel: null, wrong: 0, hintSq: null, busy: false, done: false, played: [],
                     mistakes: 0, hints: 0, shown: 0 });
  $('doneCard').hidden = true;
  const flip = line().side === 'b';
  if (flip !== flipped) { buildSquares(flip); pieces.forEach((pc) => pc.el.remove()); pieces = []; }
  setPosition(S.fen, false);
  const ch = DATA[c];
  setWhy(l === 0 || ch.id === 'puzzles' ? ch.intro : `Same start, new line: <strong>${line().title}</strong>.`);
  renderBar(); renderMoves();
  if (cur().by === 's') { runAuto(); return; }
  S.busy = true; // the opponent moves first; no input until it has
  setStatus('', 'Watch the first move…');
  paintSquares(); updateButtons();
  later(runAuto, 450);
}

function applyStep() {
  const st = cur();
  S.fen = st.fen; S.last = st.uci; S.played.push(st); S.step++;
  S.sel = null; S.hintSq = null; S.wrong = 0;
  if (st.why) setWhy(`<b>${st.num} ${st.san}</b>  ${st.why}`);
  setPosition(S.fen, true);
  renderMoves(); paintSquares();
}

function runAuto() {
  if (S.step >= line().steps.length) return finish();
  if (cur().by === 'a') {
    S.busy = true; updateButtons(); paintSquares();
    const step = S.step;
    // Only play the reply this timer was scheduled for; a duplicate timer must never play the student's move.
    later(() => { if (S.step !== step) return; applyStep(); S.busy = false; runAuto(); }, 650);
    return;
  }
  S.busy = false;
  setStatus('', `Your move. Find ${line().side === 'w' ? "White's" : "Black's"} best move.`);
  updateButtons(); paintSquares();
}

function finish() {
  S.done = true;
  const slips = S.mistakes + S.hints;
  const stars = S.shown ? 1 : slips === 0 ? 3 : slips <= 2 ? 2 : 1;
  progress[line().id] = Math.max(progress[line().id] || 0, stars);
  save();
  setStatus('done', '✓ ' + line().done);
  renderBar(); updateButtons(); paintSquares();
  const lastInLevel = S.l + 1 >= DATA[S.c].lines.length, lastLevel = S.c + 1 >= DATA.length;
  $('dcStars').innerHTML = starHtml(stars, 3);
  $('dcTitle').textContent = stars === 3 ? 'Perfect!' : stars === 2 ? 'Well done!' : 'Done!';
  $('dcText').textContent = stars === 3 ? line().done : stars === 2 ? 'Play it again without hints for 3 stars.' : 'Try again on your own for more stars.';
  $('next').textContent = !lastInLevel ? 'Next line ▶' : !lastLevel ? 'Next level ▶' : 'All levels';
  later(() => { $('doneCard').hidden = false; }, 500);
}

$('again').onclick = () => startLine(S.c, S.l);
$('next').onclick = () => {
  if (S.l + 1 < DATA[S.c].lines.length) return startLine(S.c, S.l + 1);
  if (S.c + 1 < DATA.length) return startLine(S.c + 1, 0);
  showHome();
};

// Returns true when the move was the lesson move (and has been played).
function tryMove(from, to) {
  const st = cur(), uci = from + to;
  S.sel = null;
  if (uci === st.uci) {
    applyStep();
    setStatus('good', 'Correct ✓');
    updateButtons();
    later(runAuto, 250);
    return true;
  }
  if (!st.legal.some((u) => u.slice(0, 4) === uci)) { paintSquares(); return false; }
  S.wrong++;
  if (st.alts.includes(uci)) setStatus('alt', 'Good move too! But find the move from the lesson. Try again.');
  else { S.mistakes++; setStatus('bad', S.wrong >= 2 ? 'Not this one. Hint: ' + st.hint : 'Not this one. Try again.'); }
  if (S.wrong >= 2) S.hintSq = st.uci.slice(0, 2);
  flashBad(to);
  paintSquares();
  return false;
}

// ---------------------------------------------------------------- input (tap-tap and drag)
let drag = null;
function pointToSq(e) {
  const r = boardEl.getBoundingClientRect();
  const x = Math.floor((e.clientX - r.left) / r.width * 8), y = Math.floor((e.clientY - r.top) / r.height * 8);
  if (x < 0 || x > 7 || y < 0 || y > 7) return null;
  return 'abcdefgh'[flipped ? 7 - x : x] + (flipped ? y + 1 : 8 - y);
}
const pieceOn = (sq) => pieces.find((pc) => pc.sq === sq);

boardEl.addEventListener('pointerdown', (e) => {
  if (e.button > 0 || !studentTurn()) return;
  const sq = pointToSq(e); if (!sq) return;
  e.preventDefault();
  const pc = pieceOn(sq);
  if (S.sel && S.sel !== sq && !(pc && isMine(pc.p))) { tryMove(S.sel, sq); return; }
  if (!pc || !isMine(pc.p)) { S.sel = null; paintSquares(); return; }
  const wasSelected = S.sel === sq;
  S.sel = sq; paintSquares();
  drag = { pc, from: sq, id: e.pointerId, x: e.clientX, y: e.clientY, moving: false, wasSelected };
  try { boardEl.setPointerCapture(e.pointerId); } catch (_) {}
});

boardEl.addEventListener('pointermove', (e) => {
  if (!drag || e.pointerId !== drag.id) return;
  if (!drag.moving && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 6) return;
  drag.moving = true;
  const r = boardEl.getBoundingClientRect(), s = r.width / 8;
  drag.pc.el.classList.add('drag');
  drag.pc.el.style.transform = `translate(${e.clientX - r.left - s / 2}px, ${e.clientY - r.top - s / 2}px)`;
  paintSquares(pointToSq(e));
});

function endDrag(e, cancelled) {
  if (!drag || e.pointerId !== drag.id) return;
  const d = drag; drag = null;
  try { boardEl.releasePointerCapture(e.pointerId); } catch (_) {}
  if (!d.moving) {
    if (d.wasSelected) { S.sel = null; paintSquares(); } // second tap on the same piece deselects
    return;
  }
  const to = cancelled ? null : pointToSq(e);
  d.pc.el.classList.remove('drag');
  if (to && to !== d.from && studentTurn() && tryMove(d.from, to)) return;
  if (pieces.includes(d.pc)) place(d.pc.el, d.pc.sq); // slide back to wherever the model says it is
  if (!to || to === d.from) { S.sel = d.from; }
  paintSquares();
}
boardEl.addEventListener('pointerup', (e) => endDrag(e, false));
boardEl.addEventListener('pointercancel', (e) => endDrag(e, true));
boardEl.addEventListener('contextmenu', (e) => e.preventDefault());

// ---------------------------------------------------------------- buttons
$('hint').onclick = () => {
  if (!studentTurn()) return;
  S.hints++;
  S.hintSq = cur().uci.slice(0, 2);
  setStatus('alt', 'Hint: ' + cur().hint);
  paintSquares();
};
$('show').onclick = () => {
  if (!studentTurn()) return;
  S.shown++;
  const san = cur().san;
  applyStep();
  setStatus('alt', `The move was ${san}.`);
  updateButtons();
  later(runAuto, 400);
};
$('restart').onclick = () => startLine(S.c, S.l);

showHome();
</script>
</body>
</html>
